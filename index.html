  function bind(id, fn){
    const el = $id(id);
    if(el) el.addEventListener('click', fn);
  }

  function readSyncFields(){
    const t = $id('syncToken');
    const g = $id('syncGist');
    if(t) syncCfg.token = t.value.trim();
    if(g) syncCfg.gistId = g.value.trim();
    saveSync();
  }

  // Keep text/number inputs when the form re-renders because of a chip tap.
  function syncDraftFromForm(){
    if(!draft) return;
    const l = $id('edLabel');
    const t = $id('edTime');
    const g = $id('edGoal');
    if(l) draft.label = l.value;
    if(t) draft.time = t.value || draft.time;
    if(g){
      let v = parseInt(g.value, 10);
      if(!isNaN(v) && v > 0) draft.goalSec = Math.min(v, 120) * 60;
    }
  }

  function notifState(){
    try{ return ('Notification' in window) ? Notification.permission : 'unsupported'; }
    catch(e){ return 'unsupported'; }
  }
  function notifLabel(){
    const s = notifState();
    if(s === 'granted') return 'ON';
    if(s === 'denied') return 'ブロック中';
    if(s === 'unsupported') return '非対応';
    return '許可する';
  }

  /* ---------------- tick ---------------- */

  function tick(){
    if(data.phase !== 'ready'){
      stopReminder();
      return;
    }
    const st = dialState();
    const c = 2*Math.PI*DIAL_R;
    const fill = $q('.ring-fill');
    const clock = $q('.time-display');
    const label = $q('.state-label');
    const plan = $q('.dial-plan');
    const glow = $q('.glow');
    if(fill){
      fill.setAttribute('stroke', st.color);
      fill.setAttribute('stroke-dasharray', (c*(1-st.progress)).toFixed(1) + ' ' + c.toFixed(1));
      fill.setAttribute('stroke-dashoffset', (-c*st.progress).toFixed(1));
    }
    if(clock) clock.textContent = st.main;
    if(label) label.textContent = st.label;
    if(glow) glow.style.background = `radial-gradient(circle, ${st.color} 0%, transparent 70%)`;
    if(plan && data.armed) plan.textContent = `予定 ${fmtClock(data.armed.planned)} · 経過 ${fmtElapsed(armedElapsed())}`;

    const go = goButtonStyle(st.raw, data.armed ? typeColor(data.armed.type) : null);
    const goBtn = $id('fmGo');
    if(goBtn){ goBtn.style.background = go.background; goBtn.style.boxShadow = go.shadow; }
    $qa('.halo').forEach(h => { h.style.borderColor = go.halo; });
    placeFly($id('fmBfly'), Math.min(st.raw, 1));

    // five seconds of talking, five of quiet, then something new
    const bub = $q('.dog-bubble');
    if(bub){
      const e = armedElapsed();
      const slot = Math.floor(e / 15);
      if(slot !== barkSlot){
        barkSlot = slot;
        if(slot <= 0) barkText = FIRST_BARK; else pickBark();
        bub.innerHTML = barkText + PAW_TAG;
      }
      bub.classList.toggle('hide', (e % 15) >= 5);
    }

    if(data.soundOn !== false) startReminder(currentPlan());
  }

  function startTicking(){
    if(tickHandle) clearInterval(tickHandle);
    tickHandle = setInterval(tick, 250);
  }
  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  let watchHandle = null;
  let clockHandle = null;

  /* ---------------- actions ---------------- */

  function onQuickArm(){
    ensureAudio();
    armType(currentType(), data.fmTrack !== false);
  }

  function onGo(){
    if(!data.armed) return;
    const a = data.armed;
    const now = Date.now();
    const lag = Math.max(0, (now - a.planned)/1000);
    const rec = {
      ts: now,
      taskId: a.taskId,
      label: a.label,
      type: a.type,
      planned: a.planned,
      opened: a.opened,
      started: now,
      lag: lag,
      openDelay: Math.max(0, (a.opened - a.planned)/1000),
      goalSec: a.goalSec || 300,
      session: a.session === true,
      snoozes: a.snoozeCount || 0,
      snoozedSec: Math.round(a.snoozedTotal || 0)
    };
    data.logs = data.logs || [];
    data.logs.push(rec);
    if(rec.taskId){
      const t = (data.tasks || []).find(x => x.id === rec.taskId);
      if(t){ t.doneOn = dayKey5(); t.skipOn = null; }
    }
    data.lastResult = rec;
    data.phase = 'done';
    data.armed = null;
    stopReminder();
    stopTicking();
    playGoTone();
    const fast = lag <= rec.goalSec;
    if(fast) lastPraise = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    if(fast) playFanfare(); else playSoftFanfare();
    banner = null;
    saveData();
    render();
    if(fast) celebrate();
    else celebrate({ waves:1, per:14, reach:.62,
                     palette:['#D9C08F','#C7AC87','#E3D2AE','#B79A73','#CFA96A'] });
    const src = rec.taskId ? (data.tasks || []).find(t => t.id === rec.taskId) : null;
    const wants = PAWS.handoff() && (src ? src.session !== false : rec.session === true);
    if(wants && window.__startSession){
      handoffPending = true;
      render();
      setTimeout(() => {
        handoffPending = false;
        window.__startSession(rec.type, rec.lag);
        PAWS.setTab('ss');
        render();
      }, 3400);
    }
  }

  function applySnooze(untilTs){
    const a = data.armed;
    if(!a) return;
    ensureAudio();
    data.snoozed = {
      taskId: a.taskId, label: a.label, type: a.type, goalSec: a.goalSec,
      planned: a.planned, opened: a.opened,
      count: (a.snoozeCount || 0) + 1,
      held: a.snoozedTotal || 0,
      paused: Date.now(), at: untilTs
    };
    data.phase = 'idle';
    data.armed = null;
    snoozeOpen = false;
    stopReminder();
    stopTicking();
    playSnoozeSet();
    const d = new Date(untilTs);
    banner = { text: `一時停止しました。${pad2(d.getHours())}:${pad2(d.getMinutes())} に再開します。`, celebrate:false };
    saveData();
    render();
    setTimeout(() => { banner = null; if(data.phase === 'idle') render(); }, 5000);
  }

  // Coming back: the planned moment is pushed forward by however long the
  // snooze lasted, so the clock picks up exactly where it stopped.
  function resumeSnooze(quiet){
    const s = data.snoozed;
    if(!s) return;
    const held = Date.now() - s.paused;
    data.phase = 'ready';
    data.armed = {
      taskId: s.taskId, label: s.label, type: s.type,
      planned: s.planned + held, opened: s.opened + held,
      goalSec: s.goalSec, auto: true,
      snoozeCount: s.count, snoozedTotal: (s.held || 0) + held / 1000
    };
    data.snoozed = null;
    saveData();
    startTicking();
    render();
    if(!quiet){
      playSnoozeAlert();
      notify('そろそろ、はじめましょう', data.armed.label);
      PAWS.setTab('fm');
    }
  }

  function dropSnooze(){
    data.snoozed = null;
    saveData();
    render();
  }

  function onCancelArm(){
    data.phase = 'idle';
    data.armed = null;
    stopReminder();
    stopTicking();
    banner = { text:'今回は記録しませんでした。', celebrate:false };
    saveData();
    render();
    setTimeout(() => { banner = null; if(data.phase === 'idle') render(); }, 4000);
  }

  function onDoneReset(){
    data.phase = 'idle';
    data.lastResult = null;
    banner = null;
    saveData();
    render();
  }

  function onAddTask(){
    editId = 'new';
    urlFor = null;
    draft = {
      id: 't' + Date.now().toString(36),
      label: '',
      type: (typeList()[0] || {}).id,
      time: '09:00',
      days: [],
      once: true,
      goalSec: 300,
      on: true,
      session: true
    };
    render();
  }

  // The Schedule tab drops a plan in here, where it becomes an alarm.
  window.__addReadyTask = function(spec){
    spec = spec || {};
    const t = {
      id: 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
      label: (spec.label || '予定').slice(0, 28),
      type: spec.type || (typeList()[0] || {}).id,
      time: spec.time || '',
      days: Array.isArray(spec.days) ? spec.days.slice() : [],
      once: !!spec.once,
      goalSec: spec.goalSec || 300,
      on: true,
      session: spec.session !== false
    };
    if(t.once && t.time) t.onceDay = spec.onceDay || onceTargetDay(t.time);
    data.tasks = data.tasks || [];
    data.tasks.push(t);
    saveData();
    render();
    scheduleWatch();
    return t.id;
  };
  window.__hasReadyTask = function(id){
    return !!(data.tasks || []).find(t => t.id === id);
  };

  // Home shows whatever alarm comes next.
  window.__nextAlarm = function(){
    const now = new Date();
    let best = null;
    (data.tasks || []).forEach(t => {
      if(t.on === false || isSpent(t)) return;
      const n = nextRun(t, now);
      if(!n) return;
      if(!best || n < best.when) best = { when:n, task:t };
    });
    if(!best) return null;
    return {
      time: best.task.time,
      label: best.task.label,
      type: best.task.type,
      today: dayKey5(best.when) === dayKey5(now)
    };
  };

  function onEditTask(id){
    const t = (data.tasks || []).find(x => x.id === id);
    if(!t) return;
    if(editId === id){ editId = null; draft = null; render(); return; }
    editId = id;
    urlFor = null;
    draft = Object.assign({}, t, { days: taskDays(t).slice() });
    render();
  }

  function onSaveTask(){
    if(!draft) return;
    syncDraftFromForm();
    if(!draft.label || !draft.label.trim()) draft.label = '名称未設定';
    draft.label = draft.label.trim();
    if(draft.time && !/^\d{1,2}:\d{2}$/.test(draft.time)) draft.time = '';
    // A one-off is pinned to the single day it will run on.
    if(draft.once && draft.time) draft.onceDay = onceTargetDay(draft.time);
    else { draft.once = false; delete draft.onceDay; }
    data.tasks = data.tasks || [];
    if(editId === 'new'){
      data.tasks.push(draft);
    } else {
      const i = data.tasks.findIndex(x => x.id === editId);
      if(i >= 0){
        const prev = data.tasks[i];
        // A task only fires once a day. If its schedule changed, today's
        // firing has to count as unused again.
        const rescheduled = prev.time !== draft.time ||
          !!prev.once !== !!draft.once || prev.onceDay !== draft.onceDay ||
          String(taskDays(prev)) !== String(taskDays(draft));
        data.tasks[i] = Object.assign({}, prev, draft);
        if(rescheduled) data.tasks[i].firedOn = null;
      }
      else data.tasks.push(draft);
    }
    editId = null; draft = null;
    saveData();
    render();
  }

  function onDeleteTask(){
    if(editId === null || editId === 'new') return;
    if(!confirm('このタスクを削除しますか？')) return;
    data.tasks = (data.tasks || []).filter(t => t.id !== editId);
    editId = null; draft = null;
    saveData();
    render();
  }

  function onToggleTask(id){
    const t = (data.tasks || []).find(x => x.id === id);
    if(!t) return;
    t.on = t.on === false;
    if(t.on) t.firedOn = null;          // switching it back on re-arms today
    saveData();
    render();
  }

  function ensureTypes(){
    if(!data.types || !data.types.length) data.types = DEFAULT_TYPES.map(t => Object.assign({}, t));
    return data.types;
  }

  function onTypeEdit(id, patch){
    const list = ensureTypes();
    const t = list.find(x => x.id === id);
    if(!t) return;
    if(patch.label !== undefined){
      const v = String(patch.label).trim();
      t.label = v || t.id;
    }
    if(patch.color !== undefined) t.color = patch.color;
    if(patch.icon !== undefined){ t.icon = patch.icon; iconPickerFor = null; }
    saveData();
    render();
  }

  function onTypeAdd(){
    const list = ensureTypes();
    if(list.length >= 10) return;
    const palette = ['#8FB98A','#D2A25C','#9A8FC0','#D08C70','#7FB3AC','#B58AA6'];
    list.push({
      id: 'ty' + Date.now().toString(36),
      label: 'NEW',
      color: palette[list.length % palette.length],
      icon: ICON_KEYS[list.length % ICON_KEYS.length]
    });
    saveData();
    render();
  }

  function onTypeDelete(id){
    const list = ensureTypes();
    if(list.length <= 1) return;
    const i = list.findIndex(t => t.id === id);
    if(i < 0) return;
    if(!confirm('この種類を削除しますか？（過去の記録は残ります）')) return;
    list.splice(i, 1);
    (data.tasks || []).forEach(t => { if(t.type === id) t.type = list[0].id; });
    if(draft && draft.type === id) draft.type = list[0].id;
    iconPickerFor = null;
    saveData();
    render();
  }

  function onClearLogs(){
    if(!confirm('すべての記録を削除しますか？元に戻せません。\n（同期している端末からも消えます）')) return;
    addTombs((data.logs || []).map(logKey));
    data.logs = [];
    saveData();
    render();
  }

  function onDeleteLog(key){
    const l = (data.logs || []).find(x => logKey(x) === key);
    if(!l) return;
    if(!confirm(`${l.label} の記録（${fmtElapsed(l.lag)}）を削除しますか？`)) return;
    addTombs([key]);
    data.logs = data.logs.filter(x => logKey(x) !== key);
    saveData();
    render();
  }

  function onSoundToggle(){
    data.soundOn = data.soundOn === false;
    if(!data.soundOn) stopReminder();
    saveData();
    render();
    if(data.soundOn){ ensureAudio(); playChime(); }
  }

  function onAutoToggle(){
    data.autoArm = data.autoArm === false;
    saveData();
    render();
  }

  function onNotifRequest(){
    if(notifState() !== 'default') return;
    try{
      Notification.requestPermission().then(() => render());
    }catch(e){}
  }

  function copyUrl(id){
    const url = shortcutUrl(id);
    const done = () => { banner = { text:'URL をコピーしました。ショートカットに貼り付けてください。', celebrate:false };
      render(); setTimeout(() => { banner = null; render(); }, 4000); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done, fallback);
        return;
      }
    }catch(e){}
    fallback();
    function fallback(){
      const ta = document.createElement('textarea');
      ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); done(); }catch(e){ prompt('この URL をコピーしてください', url); }
      ta.remove();
    }
  }

  /* ---------------- backup ---------------- */

  function exportData(){
    const payload = { app:'on-your-marks', version:1, exportedAt:new Date().toISOString(), data:data };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const d = new Date();
    const stamp = d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `first-move-${stamp}.json`;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = () => {
      let incoming;
      try{
        const parsed = JSON.parse(reader.result);
        incoming = parsed && parsed.data ? parsed.data : parsed;
      }catch(e){ alert('このファイルは読み込めませんでした。'); return; }
      if(!incoming || !Array.isArray(incoming.logs)){ alert('記録が見つかりませんでした。'); return; }
      const mine = (data.logs || []).length, theirs = incoming.logs.length;
      const merge = mine > 0
        ? confirm(`読み込むファイルには ${theirs} 件の記録があります。\n\nOK: いまの ${mine} 件と統合する\nキャンセル: いまの記録を捨てて置き換える`)
        : false;
      if(merge){
        const seen = new Set((data.logs||[]).map(l => l.ts + ':' + Math.round(l.lag||0)));
        incoming.logs.forEach(l => {
          const k = l.ts + ':' + Math.round(l.lag||0);
          if(!seen.has(k)){ data.logs.push(l); seen.add(k); }
        });
        const ids = new Set((data.tasks||[]).map(t => t.id));
        (incoming.tasks||[]).forEach(t => { if(!ids.has(t.id)) data.tasks.push(t); });
      } else {
        data = Object.assign({}, DEFAULT_DATA, incoming);
        data.phase = 'idle'; data.armed = null; data.lastResult = null;
      }
      saveData();
      render();
      alert('読み込みました。');
    };
    reader.readAsText(file);
  }

  /* ---------------- init ---------------- */

  function unlockAudioOnce(){
    const go = () => {
      ensureAudio();
      if(data.phase === 'ready' && data.soundOn !== false) startReminder(currentPlan());
      document.removeEventListener('touchstart', go, true);
      document.removeEventListener('click', go, true);
    };
    document.addEventListener('touchstart', go, true);
    document.addEventListener('click', go, true);
  }

  function init(){
    // Inside the little window there is nothing of Ready to show, and a
    // second copy must not fire alarms of its own.
    if(/[?&]mini=1/.test(location.search)) return;
    loadData();
    PAWS.register('fm', {
      gistFile: 'on-your-marks.json',
      appId: 'on-your-marks',
      payload: syncPayload,
      merge: mergeRemote,
      rerender: () => render()
    });
    unlockAudioOnce();

    // A stale "ready" from a previous visit older than 12 h is dropped.
    if(data.phase === 'ready' && data.armed){
      if(Date.now() - data.armed.planned > 12*3600*1000){
        data.phase = 'idle'; data.armed = null; saveData();
      }
    }

    const armedByUrl = bootArm();
    if(armedByUrl) window.__fmArmedByUrl = true;
    if(!armedByUrl && data.phase === 'ready') startTicking();

    scheduleWatch();
    watchHandle = setInterval(scheduleWatch, 1000);
    clockHandle = setInterval(() => {
      if(data.phase === 'idle' && editId === null) render();
    }, 30000);

    document.addEventListener('visibilitychange', () => {
      if(!document.hidden){
        if(data.phase === 'ready') startTicking();
        render();
        scheduleWatch();          // a tab that was asleep catches up here
      }
    });
    window.addEventListener('focus', scheduleWatch);

    render();
    if(data.phase === 'ready') startTicking();
  }

  init();
})();

</script>

<script>
/* =====================================================================
   Schedule — the plain calendar that sits before Ready.
   It keeps its own events; a timed one can be handed over to Ready,
   where it becomes a task that starts the timer.
   ===================================================================== */
(function(){
  'use strict';

  const app = document.getElementById('paneCal');
  if(!app) return;
  if(/[?&]mini=1/.test(location.search)) return;   // the little window is only the timer

  const $id = id => app.querySelector('#' + id);
  const $qa = sel => app.querySelectorAll(sel);

  const data = PAWS.section('cal', {
    events: [],        // { id, title, date, allDay, start, end, type, note, repeat, at, taskId }
    tombs: [],
    view: 'month'
  });

  const TOMB_MAX = 800;

  /* ---------------- dates ---------------- */

  const pad2 = n => String(n).padStart(2, '0');
  const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  function parseKey(k){
    const p = String(k || '').split('-').map(Number);
    if(p.length !== 3 || isNaN(p[0])) return new Date();
    return new Date(p[0], p[1] - 1, p[2]);
  }
  const todayKey = () => keyOf(new Date());
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  // Monday first, the way the week reads here
  const idxOf = d => (d.getDay() + 6) % 7;
  const mondayOf = d => addDays(d, -idxOf(d));
  const WD = ['月','火','水','木','金','土','日'];

  let cursor = todayKey();     // the day in focus
  let editId = null;           // event being edited, or 'new'
  let draft = null;
  let note = null;             // a short line under the header
  let scrollToEditor = false;  // after a plan is opened from the grid

  /* ---------------- types, shared with the rest ---------------- */

  const DEFAULT_TYPES = [
    { id:'WORK',  label:'WORK',  color:'#46AFC2' },
    { id:'READ',  label:'READ',  color:'#C7929F' },
    { id:'STUDY', label:'STUDY', color:'#8FB4C4' },
    { id:'OTHER', label:'OTHER', color:'#C7AC87' }
  ];
  const typeList = () => (data.types && data.types.length) ? data.types : DEFAULT_TYPES;
  const typeOf = id => typeList().find(t => t.id === id) || { id:id, label:id || '—', color:'#B9AFA5' };
  const typeColor = id => typeOf(id).color;
  const typeLabel = id => typeOf(id).label;

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  // A wash of the type's colour, for the inside of a box whose edge is that colour.
  function tint(hex, amt){
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if(!m) return '#F7F3EB';
    const n = parseInt(m[1], 16);
    const mix = c => Math.round(c + (255 - c) * (1 - amt));
    return '#' + [mix((n >> 16) & 255), mix((n >> 8) & 255), mix(n & 255)]
      .map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const toMin = t => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(t || ''));
    return m ? Math.min(1439, parseInt(m[1], 10) * 60 + parseInt(m[2], 10)) : null;
  };
  const hhmm = m => pad2(Math.floor(m / 60)) + ':' + pad2(m % 60);

  /* ---------------- events ---------------- */

  function events(){ return data.events || (data.events = []); }

  // Does this event land on that day? Repeats grow forward from its own date.
  function onDay(ev, dayKey){
    if(!ev.date) return false;
    if(ev.date === dayKey) return true;
    if(!ev.repeat || ev.repeat === 'none') return false;
    if(dayKey < ev.date) return false;
    const a = parseKey(ev.date), b = parseKey(dayKey);
    if(ev.repeat === 'week')  return idxOf(a) === idxOf(b);
    if(ev.repeat === 'month') return a.getDate() === b.getDate();
    if(ev.repeat === 'year')  return a.getDate() === b.getDate() && a.getMonth() === b.getMonth();
    return false;
  }
  function eventsOn(dayKey){
    return events().filter(e => onDay(e, dayKey)).sort((x, y) => {
      if(!!x.allDay !== !!y.allDay) return x.allDay ? -1 : 1;
      return String(x.start || '').localeCompare(String(y.start || ''));
    });
  }
  function timeText(e){
    if(e.allDay) return '';
    if(e.start && e.end) return e.start + '–' + e.end;
    return e.start || '';
  }
  function repeatLabel(e){
    return e.repeat === 'week' ? '毎週' + WD[idxOf(parseKey(e.date))] + '曜'
         : e.repeat === 'month' ? '毎月' + parseKey(e.date).getDate() + '日'
         : e.repeat === 'year' ? '毎年' + (parseKey(e.date).getMonth()+1) + '/' + parseKey(e.date).getDate()
         : '';
  }

  function save(){ PAWS.save(); }
  function addTombs(ids){
    const t = data.tombs || (data.tombs = []);
    ids.forEach(id => { if(t.indexOf(id) < 0) t.push(id); });
    if(t.length > TOMB_MAX) data.tombs = t.slice(-TOMB_MAX);
  }

  /* ---------------- sync ---------------- */

  function payload(){
    return {
      app:'schedule', version:1,
      metaAt: data.metaAt || 0,
      savedAt: new Date().toISOString(),
      events: events(),
      tombs: data.tombs || []
    };
  }
  function mergeRemote(r){
    if(!r || r.app !== 'schedule') return false;
    let changed = false;
    const tomb = new Set([].concat(data.tombs || [], r.tombs || []));
    const byId = {};
    events().forEach(e => { byId[e.id] = e; });
    (r.events || []).forEach(e => {
      if(!e || !e.id || tomb.has(e.id)) return;
      const cur = byId[e.id];
      if(!cur || (e.at || 0) > (cur.at || 0)){ byId[e.id] = e; changed = true; }
    });
    const before = events().length;
    const list = Object.keys(byId).map(k => byId[k]).filter(e => !tomb.has(e.id));
    if(list.length !== before) changed = true;
    data.events = list.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    const nt = Array.from(tomb).slice(-TOMB_MAX);
    if(nt.length !== (data.tombs || []).length){ data.tombs = nt; changed = true; }
    return changed;
  }

  /* ---------------- the header ---------------- */

  function headTitle(){
    const d = parseKey(cursor);
    if(data.view === 'day')  return `<b>${d.getMonth()+1}月${d.getDate()}日</b> <span>${WD[idxOf(d)]}</span>`;
    if(data.view === 'week'){
      const a = mondayOf(d), b = addDays(a, 6);
      return `<b>${a.getMonth()+1}/${a.getDate()} – ${b.getMonth()+1}/${b.getDate()}</b> <span>${a.getFullYear()}</span>`;
    }
    return `<b>${d.getMonth()+1}月</b> <span>${d.getFullYear()}</span>`;
  }

  function step(dir){
    const d = parseKey(cursor);
    if(data.view === 'month') d.setMonth(d.getMonth() + dir);
    else if(data.view === 'week') d.setDate(d.getDate() + dir * 7);
    else d.setDate(d.getDate() + dir);
    cursor = keyOf(d);
  }

  /* ---------------- the month ---------------- */

  function renderMonth(){
    const cur = parseKey(cursor);
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const start = mondayOf(first);
    const tk = todayKey();
    let cells = '';
    for(let i = 0; i < 42; i++){
      const d = addDays(start, i);
      const k = keyOf(d);
      const other = d.getMonth() !== cur.getMonth();
      const list = eventsOn(k);      // every plan of the day is shown
      cells += `<button class="cal-cell ${other ? 'other' : ''} ${k === cursor ? 'sel' : ''}" data-day="${k}">
        <span class="dnum ${k === tk ? 'today' : ''} ${idxOf(d) === 5 ? 'sat' : ''} ${idxOf(d) === 6 ? 'sun' : ''}">${d.getDate()}</span>
        <span class="chips">
          ${list.map(e => `<span class="chip" data-chip="${esc(e.id)}" style="--c:${typeColor(e.type)}; --cb:${tint(typeColor(e.type), 0.13)}"
            title="${esc((timeText(e) ? timeText(e) + ' ' : '') + e.title)}">
            <span class="ct">${esc(e.allDay ? '終日' : (e.start || ''))}</span>
            <span class="cn"><i></i>${esc(e.title)}</span>
          </span>`).join('')}
        </span>
      </button>`;
      if(i % 7 === 6 && d >= new Date(cur.getFullYear(), cur.getMonth() + 1, 0) && i >= 27) break;
    }
    return `<div class="cal-grid">
      <div class="cal-wd">${WD.map((w, i) => `<span class="${i===5?'sat':''} ${i===6?'sun':''}">${w}</span>`).join('')}</div>
      <div class="cal-cells">${cells}</div>
    </div>`;
  }

  /* ---------------- the week and the day ---------------- */

  function dayCard(k, big){
    const d = parseKey(k);
    const list = eventsOn(k);
    const tk = todayKey();
    return `<div class="cal-day ${k === tk ? 'is-today' : ''} ${big ? 'big' : ''}">
      <div class="cal-day-head" data-day="${k}">
        <span class="dd ${idxOf(d)===5?'sat':''} ${idxOf(d)===6?'sun':''}">${d.getMonth()+1}/${d.getDate()}</span>
        <span class="dw">${WD[idxOf(d)]}</span>
        ${k === tk ? '<span class="tnow">today</span>' : ''}
      </div>
      ${list.length ? `<div class="cal-day-list">${list.map(e => eventRow(e)).join('')}</div>`
                    : '<div class="cal-none">予定なし</div>'}
    </div>`;
  }

  function eventRow(e){
    return `<button class="cal-ev" data-edit="${esc(e.id)}"
      style="--c:${typeColor(e.type)}; --cb:${tint(typeColor(e.type), 0.13)}">
      <span class="ev-time">${e.allDay ? '終日' : esc(timeText(e) || '—')}</span>
      <span class="ev-body">
        <span class="ev-title">${esc(e.title)}</span>
        <span class="ev-meta">
          <i style="background:${typeColor(e.type)}"></i>${esc(typeLabel(e.type))}
          ${e.repeat && e.repeat !== 'none' ? '<span>·</span><span>' + esc(repeatLabel(e)) + '</span>' : ''}
          ${e.taskId ? '<span>·</span><span class="ev-sent">Alarm 登録済み</span>' : ''}
        </span>
        ${e.note ? `<span class="ev-note">${esc(e.note)}</span>` : ''}
      </span>
    </button>`;
  }

  // The day as a timetable: hours down the side, plans in their own slot.
  const ROW_H = 46;

  function renderTimetable(k){
    const d = parseKey(k);
    const list = eventsOn(k);
    const allDay = list.filter(e => e.allDay);
    const loose  = list.filter(e => !e.allDay && !e.start);
    const timed  = list.filter(e => !e.allDay && e.start).map(e => {
      const s = toMin(e.start);
      const en = e.end ? toMin(e.end) : null;
      return { e: e, s: s, en: Math.min(1440, Math.max(en == null ? s + 45 : en, s + 30)) };
    }).sort((a, b) => a.s - b.s || a.en - b.en);

    // the window of hours worth showing
    let lo = 8 * 60, hi = 19 * 60;
    timed.forEach(t => { lo = Math.min(lo, t.s); hi = Math.max(hi, t.en); });
    lo = Math.max(0, Math.floor(lo / 60) * 60 - 60);
    hi = Math.min(1440, Math.ceil(hi / 60) * 60 + 60);

    // plans that overlap share the width, cluster by cluster
    let i = 0;
    while(i < timed.length){
      let j = i, end = timed[i].en;
      while(j + 1 < timed.length && timed[j + 1].s < end){ j++; end = Math.max(end, timed[j].en); }
      const group = timed.slice(i, j + 1);
      const colEnd = [];
      group.forEach(t => {
        let c = 0;
        while(c < colEnd.length && colEnd[c] > t.s) c++;
        colEnd[c] = t.en; t.col = c;
      });
      group.forEach(t => { t.cols = Math.max(1, colEnd.length); });
      i = j + 1;
    }

    const hours = [];
    for(let m = lo; m < hi; m += 60) hours.push(m);
    const now = new Date();
    const liveMin = (k === todayKey()) ? now.getHours() * 60 + now.getMinutes() : null;

    return `<div class="tt">
      <div class="tt-top">
        <span class="dd ${idxOf(d)===5?'sat':''} ${idxOf(d)===6?'sun':''}">${d.getMonth()+1}/${d.getDate()}</span>
        <span class="dw">${WD[idxOf(d)]}</span>
        ${k === todayKey() ? '<span class="tnow">today</span>' : ''}
      </div>
      ${allDay.length || loose.length ? `<div class="tt-allday">
        ${allDay.concat(loose).map(e => `<button class="tt-chip" data-edit="${esc(e.id)}"
          style="--c:${typeColor(e.type)}; --cb:${tint(typeColor(e.type), 0.13)}">
          <i></i>${esc(e.title)}${e.allDay ? '' : ' <span class="no-t">時間未定</span>'}
        </button>`).join('')}
      </div>` : ''}
      <div class="tt-grid" style="--rh:${ROW_H}px">
        <div class="tt-hours">
          ${hours.map(m => `<div class="tt-hour"><span>${Math.floor(m/60)}</span></div>`).join('')}
        </div>
        <div class="tt-body" style="height:${hours.length * ROW_H}px">
          ${hours.map((m, n) => `<button class="tt-slot" data-slot="${m}" style="top:${n * ROW_H}px"></button>`).join('')}
          ${liveMin != null && liveMin >= lo && liveMin <= hi
            ? `<div class="tt-now" style="top:${(liveMin - lo) / 60 * ROW_H}px"></div>` : ''}
          ${timed.map(t => {
            const top = (t.s - lo) / 60 * ROW_H;
            const h = Math.max(26, (t.en - t.s) / 60 * ROW_H - 3);
            const w = 100 / (t.cols || 1);
            const time = esc(hhmm(t.s)) + (t.e.end ? '–' + esc(t.e.end) : '');
            const body = h < 44
              ? `<span class="te-line"><i></i><b>${time}</b>${esc(t.e.title)}</span>`
              : `<span class="te-time">${time}</span>
                 <span class="te-title"><i></i>${esc(t.e.title)}</span>
                 ${t.e.note && h > 66 ? `<span class="te-note">${esc(t.e.note)}</span>` : ''}`;
            return `<button class="tt-ev ${h < 44 ? 'short' : ''}" data-edit="${esc(t.e.id)}"
              style="top:${top.toFixed(1)}px; height:${h.toFixed(1)}px;
                     left:${(t.col * w).toFixed(2)}%; width:calc(${w.toFixed(2)}% - 4px);
                     --c:${typeColor(t.e.type)}; --cb:${tint(typeColor(t.e.type), 0.13)}">
              ${body}
            </button>`;
          }).join('')}
        </div>
      </div>
    </div>`;
  }

  function renderWeek(){
    const a = mondayOf(parseKey(cursor));
    let out = '';
    for(let i = 0; i < 7; i++) out += dayCard(keyOf(addDays(a, i)), false);
    return `<div class="cal-week">${out}</div>`;
  }

  /* ---------------- the editor ---------------- */

  function blankEvent(){
    return {
      id: uid(),
      title: '',
      date: cursor,
      allDay: false,
      start: '09:00',
      end: '',
      type: (typeList()[0] || {}).id,
      note: '',
      repeat: 'none'
    };
  }

  function renderEditor(){
    if(editId === null || !draft) return '';
    const t = draft;
    const sent = !!(t.taskId && window.__hasReadyTask && window.__hasReadyTask(t.taskId));
    return `<div class="editor cal-editor">
      <div class="ed-title">${editId === 'new' ? 'new plan' : 'edit plan'}</div>
      <div class="ed-field">
        <label>予定</label>
        <input type="text" id="cvTitle" maxlength="40" value="${esc(t.title)}" placeholder="例: 可燃ごみ">
      </div>
      <div class="ed-field">
        <label>日付</label>
        <input type="date" id="cvDate" value="${esc(t.date)}">
      </div>
      <div class="ed-field">
        <label>終日</label>
        <button class="toggle ${t.allDay ? 'on' : ''}" id="cvAllDay">${t.allDay ? 'ON' : 'OFF'}</button>
      </div>
      ${t.allDay ? '' : `
      <div class="ed-field">
        <label>時間</label>
        <input type="time" id="cvStart" value="${esc(t.start || '')}">
        <span class="unit">→</span>
        <input type="time" id="cvEnd" value="${esc(t.end || '')}">
      </div>`}
      <div class="ed-field">
        <label>種類</label>
        <div class="type-picker">
          ${typeList().map(x => `<button data-ctype="${esc(x.id)}"
            style="${t.type === x.id ? `background:linear-gradient(135deg,${x.color},${x.color}); border-color:transparent; color:#fff; font-weight:700;` : ''}">${esc(x.label)}</button>`).join('')}
        </div>
      </div>
      <div class="ed-field">
        <label>くり返し</label>
        <div class="rep-picker">
          ${[['none','なし'],['week','毎週'],['month','毎月'],['year','毎年']].map(r =>
            `<button data-rep="${r[0]}" class="${(t.repeat || 'none') === r[0] ? 'on' : ''}">${r[1]}</button>`).join('')}
        </div>
      </div>
      <div class="ed-field">
        <label>メモ</label>
        <input type="text" id="cvNote" maxlength="80" value="${esc(t.note || '')}" placeholder="任意">
      </div>
      ${t.allDay ? '' : `<div class="send-row">
        <button class="mini-btn solid" id="cvSend" ${sent ? 'disabled' : ''}>${sent ? 'Alarm に登録済み' : 'Alarm に登録する'}</button>
        <span class="send-note">Home の Alarm に入り、その時間になるとタイマーが始まります</span>
      </div>`}
      <div class="ed-actions">
        <button class="ed-save" id="cvSave">SAVE</button>
        ${editId === 'new' ? '' : '<button class="ed-del" id="cvDel">DELETE</button>'}
        <button class="ed-cancel" id="cvCancel">CANCEL</button>
      </div>
    </div>`;
  }

  /* ---------------- render ---------------- */

  function render(){
    const view = data.view || 'month';
    app.innerHTML = `
      <div class="cal-bar">
        <button class="cal-nav" id="calPrev" title="前へ">‹</button>
        <div class="cal-title">${headTitle()}</div>
        <button class="cal-nav" id="calNext" title="次へ">›</button>
        <button class="cal-today" id="calToday">今日</button>
      </div>

      <div class="cal-views">
        ${[['month','月'],['week','週'],['day','日']].map(v =>
          `<button data-view="${v[0]}" class="${view === v[0] ? 'on' : ''}">${v[1]}</button>`).join('')}
      </div>

      ${note ? `<div class="cal-note">${esc(note)}</div>` : ''}

      ${view === 'month' ? renderMonth() : view === 'week' ? renderWeek() : ''}

      ${view === 'day' ? renderTimetable(cursor) : ''}

      <div>
        <div class="section-title">
          <span>${view === 'month' ? (parseKey(cursor).getMonth()+1) + '月' + parseKey(cursor).getDate() + '日' : 'この日'}</span>
          <span class="tools"><button class="mini-btn solid" id="calAdd">+ 追加</button></span>
        </div>
        ${editId !== null ? renderEditor() + '<div style="height:10px"></div>' : ''}
        ${view === 'day' ? '' : (eventsOn(cursor).length
            ? `<div class="cal-day-list plain">${eventsOn(cursor).map(e => eventRow(e)).join('')}</div>`
            : '<div class="empty-state">この日の予定はまだありません。</div>')}
      </div>
    `;
    bind();
    if(scrollToEditor){
      scrollToEditor = false;
      const ed = app.querySelector('.cal-editor');
      if(ed) setTimeout(() => ed.scrollIntoView({ block:'center', behavior:'smooth' }), 30);
    }
  }

  function bind(){
    const on = (id, fn) => { const el = $id(id); if(el) el.addEventListener('click', fn); };
    on('calPrev', () => { step(-1); note = null; render(); });
    on('calNext', () => { step(1);  note = null; render(); });
    on('calToday', () => { cursor = todayKey(); note = null; render(); });
    $qa('[data-view]').forEach(b => b.addEventListener('click', () => {
      data.view = b.dataset.view; PAWS.save(false); render();
    }));
    $qa('[data-day]').forEach(b => b.addEventListener('click', () => {
      cursor = b.dataset.day;
      if(editId === 'new' && draft) draft.date = cursor;
      render();
    }));
    const openEditor = id => {
      const e = events().find(x => x.id === id);
      if(!e) return;
      editId = e.id;
      draft = Object.assign({}, e);
      scrollToEditor = true;
      render();
    };
    $qa('[data-edit]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      openEditor(b.dataset.edit);
    }));
    // a box inside a day cell: open it without also selecting the day
    $qa('[data-chip]').forEach(el => el.addEventListener('click', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      const cell = el.closest('[data-day]');
      if(cell) cursor = cell.dataset.day;
      openEditor(el.dataset.chip);
    }));
    on('calAdd', () => { editId = 'new'; draft = blankEvent(); render(); });
    $qa('[data-slot]').forEach(b => b.addEventListener('click', () => {
      editId = 'new';
      draft = blankEvent();
      draft.start = hhmm(parseInt(b.dataset.slot, 10));
      render();
    }));

    // editor
    $qa('[data-ctype]').forEach(b => b.addEventListener('click', () => {
      if(!draft) return; readForm(); draft.type = b.dataset.ctype; render();
    }));
    $qa('[data-rep]').forEach(b => b.addEventListener('click', () => {
      if(!draft) return; readForm(); draft.repeat = b.dataset.rep; render();
    }));
    on('cvAllDay', () => { if(!draft) return; readForm(); draft.allDay = !draft.allDay; render(); });
    on('cvCancel', () => { editId = null; draft = null; render(); });
    on('cvSave', onSave);
    on('cvDel', onDelete);
    on('cvSend', onSend);
  }

  function readForm(){
    if(!draft) return;
    const v = id => { const el = $id(id); return el ? el.value : null; };
    const t = v('cvTitle'); if(t !== null) draft.title = t;
    const d = v('cvDate');  if(d) draft.date = d;
    const s = v('cvStart'); if(s !== null) draft.start = s;
    const e = v('cvEnd');   if(e !== null) draft.end = e;
    const n = v('cvNote');  if(n !== null) draft.note = n;
  }

  function onSave(){
    if(!draft) return;
    readForm();
    if(!draft.title || !draft.title.trim()) draft.title = '予定';
    draft.title = draft.title.trim();
    if(!draft.date) draft.date = cursor;
    if(draft.allDay){ draft.start = ''; draft.end = ''; }
    draft.at = Date.now();
    const list = events();
    const i = list.findIndex(x => x.id === draft.id);
    if(i >= 0) list[i] = draft; else list.push(draft);
    list.sort((a, b) => String(a.date).localeCompare(String(b.date)));
    cursor = draft.date;
    editId = null; draft = null;
    save();
    render();
  }

  function onDelete(){
    if(!draft) return;
    addTombs([draft.id]);
    data.events = events().filter(x => x.id !== draft.id);
    editId = null; draft = null;
    save();
    render();
  }

  // Hand a timed plan over to Ready, where it becomes a task with an alarm.
  function onSend(){
    if(!draft) return;
    readForm();
    if(!draft.start){ note = '時間を入れてから登録してください。'; render(); return; }
    if(typeof window.__addReadyTask !== 'function'){ note = 'Alarm がまだ準備中です。'; render(); return; }
    const weekly = draft.repeat === 'week';
    const id = window.__addReadyTask({
      label: draft.title || '予定',
      type: draft.type,
      time: draft.start,
      days: weekly ? [idxOf(parseKey(draft.date))] : [],
      once: !weekly,
      onceDay: weekly ? null : draft.date
    });
    draft.taskId = id;
    draft.at = Date.now();
    const list = events();
    const i = list.findIndex(x => x.id === draft.id);
    if(i >= 0) list[i] = Object.assign({}, draft); else list.push(Object.assign({}, draft));
    save();
    note = 'Alarm に登録しました。';
    render();
    PAWS.setTab('fm');
  }

  /* ---------------- start ---------------- */

  // Home reads today's plans through these.
  window.__planOn = function(dayKey){ return eventsOn(dayKey); };
  window.__openPlan = function(id){
    const e = events().find(x => x.id === id);
    if(!e) return false;
    cursor = todayKey();
    editId = e.id;
    draft = Object.assign({}, e);
    scrollToEditor = true;
    render();
    return true;
  };

  PAWS.register('cal', {
    gistFile: 'schedule.json',
    appId: 'schedule',
    payload: payload,
    merge: mergeRemote,
    rerender: () => render()
  });

  render();
})();

</script>

<script>
/* =====================================================================
   Home — the first thing you see: the day, the sky, and what is on it.
   ===================================================================== */
(function(){
  'use strict';

  const app = document.getElementById('homeTop');
  if(!app) return;
  if(/[?&]mini=1/.test(location.search)) return;

  const $id = id => app.querySelector('#' + id);
  const $qa = sel => app.querySelectorAll(sel);

  const data = PAWS.section('home', {
    place: null,      // { name, lat, lon }
    wx: null,         // { at, code, temp, hi, lo, pop }
    askedGeo: false
  });

  let placeOpen = false;
  let hits = [];               // places that answered to the name typed
  let busy = false;
  let msg = null;

  /* ---------------- little helpers ---------------- */

  const pad2 = n => String(n).padStart(2, '0');
  const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  const WD = ['月','火','水','木','金','土','日'];
  const WD_EN = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];
  const idxOf = d => (d.getDay() + 6) % 7;
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }
  function tint(hex, amt){
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if(!m) return '#F7F3EB';
    const n = parseInt(m[1], 16);
    const mix = c => Math.round(c + (255 - c) * (1 - amt));
    return '#' + [mix((n >> 16) & 255), mix((n >> 8) & 255), mix(n & 255)]
      .map(x => x.toString(16).padStart(2, '0')).join('');
  }
  const DEFAULT_TYPES = [
    { id:'WORK',  label:'WORK',  color:'#46AFC2' },
    { id:'READ',  label:'READ',  color:'#C7929F' },
    { id:'STUDY', label:'STUDY', color:'#8FB4C4' },
    { id:'OTHER', label:'OTHER', color:'#C7AC87' }
  ];
  const typeList = () => (data.types && data.types.length) ? data.types : DEFAULT_TYPES;
  const typeOf = id => typeList().find(t => t.id === id) || { id:id, label:id || '—', color:'#B9AFA5' };

  /* ---------------- the weather ---------------- */

  // Open-Meteo's codes, gathered into the handful of skies worth naming.
  function sky(code){
    if(code === 0) return { key:'clear', label:'快晴' };
    if(code === 1) return { key:'clear', label:'晴れ' };
    if(code === 2) return { key:'part',  label:'晴れときどきくもり' };
    if(code === 3) return { key:'cloud', label:'くもり' };
    if(code === 45 || code === 48) return { key:'fog', label:'きり' };
    if(code >= 51 && code <= 57) return { key:'rain', label:'霧雨' };
    if(code >= 61 && code <= 67) return { key:'rain', label:'雨' };
    if(code >= 71 && code <= 77) return { key:'snow', label:'雪' };
    if(code >= 80 && code <= 82) return { key:'rain', label:'にわか雨' };
    if(code === 85 || code === 86) return { key:'snow', label:'にわか雪' };
    if(code >= 95) return { key:'storm', label:'雷雨' };
    return { key:'cloud', label:'—' };
  }

  const SUN = '<circle cx="24" cy="24" r="9.5" class="w-sun"/>' +
    [0,45,90,135,180,225,270,315].map(a =>
      `<line x1="24" y1="6" x2="24" y2="11" class="w-ray" transform="rotate(${a} 24 24)"/>`).join('');
  const CLOUD = '<path class="w-cloud" d="M14 33h18a6.5 6.5 0 0 0 .6-13 9 9 0 0 0-17.2 2.2A5.6 5.6 0 0 0 14 33Z"/>';
  const DROPS = [0,1,2].map(i =>
    `<line x1="${17 + i*7}" y1="36" x2="${15 + i*7}" y2="42" class="w-drop"/>`).join('');
  const FLAKES = [0,1,2].map(i =>
    `<circle cx="${17.5 + i*7}" cy="${39 + (i%2?2:0)}" r="1.7" class="w-flake"/>`).join('');

  function skyArt(key){
    const wrap = inner => `<svg viewBox="0 0 48 48" aria-hidden="true">${inner}</svg>`;
    if(key === 'clear') return wrap(SUN);
    if(key === 'part')  return wrap('<g transform="translate(4,-4) scale(0.72)">' + SUN + '</g>' + CLOUD);
    if(key === 'cloud' || key === 'fog') return wrap(CLOUD);
    if(key === 'rain')  return wrap(CLOUD + DROPS);
    if(key === 'snow')  return wrap(CLOUD + FLAKES);
    if(key === 'storm') return wrap(CLOUD + '<path class="w-bolt" d="M24 35l-5 8h4l-2 6 7-9h-4l3-5z"/>');
    return wrap(CLOUD);
  }

  function fresh(){
    const w = data.wx;
    return !!(w && w.at && (Date.now() - w.at) < 30 * 60 * 1000 && w.day === keyOf(new Date()));
  }

  async function loadWeather(force){
    if(busy) return;
    if(!force && fresh()) return;
    const p = data.place;
    if(!p || typeof p.lat !== 'number'){ return; }
    busy = true; msg = null; render();
    try{
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.lat + '&longitude=' + p.lon
        + '&current=temperature_2m,weather_code'
        + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max'
        + '&timezone=auto&forecast_days=1';
      const r = await fetch(url);
      if(!r.ok) throw new Error('http ' + r.status);
      const j = await r.json();
      const d = j.daily || {};
      data.wx = {
        at: Date.now(),
        day: keyOf(new Date()),
        temp: j.current ? Math.round(j.current.temperature_2m) : null,
        code: (d.weather_code && d.weather_code[0] != null) ? d.weather_code[0]
              : (j.current ? j.current.weather_code : 0),
        hi: (d.temperature_2m_max || [])[0] != null ? Math.round(d.temperature_2m_max[0]) : null,
        lo: (d.temperature_2m_min || [])[0] != null ? Math.round(d.temperature_2m_min[0]) : null,
        pop: (d.precipitation_probability_max || [])[0]
      };
      PAWS.save(false);
    }catch(e){
      msg = '天気を取れませんでした。';
    }
    busy = false;
    render();
  }

  // Several places share a name — 横浜 is a city in Kanagawa and a town in
  // Aomori — so the候補 are offered, biggest first.
  async function findPlace(name){
    if(!name || !name.trim()) return;
    busy = true; msg = null; hits = []; render();
    try{
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=8&language=ja&name='
        + encodeURIComponent(name.trim()));
      const j = await r.json();
      const list = (j.results || []).slice()
        .sort((a, b) => (b.population || 0) - (a.population || 0));
      if(!list.length) throw new Error('not found');
      if(list.length === 1){
        busy = false;
        pickPlace(list[0]);
        return;
      }
      hits = list.slice(0, 5);
      busy = false;
      render();
      return;
    }catch(e){
      msg = 'その地名が見つかりませんでした。';
    }
    busy = false;
    render();
  }

  function placeName(hit){
    const area = hit.admin1 && hit.admin1 !== hit.name ? '（' + hit.admin1 + '）' : '';
    return hit.name + area;
  }

  async function pickPlace(hit){
    data.place = { name: placeName(hit), lat: hit.latitude, lon: hit.longitude };
    data.wx = null;
    hits = [];
    placeOpen = false;
    PAWS.save(false);
    await loadWeather(true);
  }

  function useHere(){
    if(!navigator.geolocation){ msg = 'この端末では現在地を使えません。'; render(); return; }
    busy = true; msg = null; render();
    navigator.geolocation.getCurrentPosition(pos => {
      data.place = { name:'現在地', lat: Math.round(pos.coords.latitude * 1000) / 1000,
                     lon: Math.round(pos.coords.longitude * 1000) / 1000 };
      data.wx = null; placeOpen = false; busy = false;
      PAWS.save(false);
      loadWeather(true);
    }, () => {
      busy = false;
      msg = '現在地を取れませんでした。地名を入れてください。';
      placeOpen = true;
      render();
    }, { timeout: 8000, maximumAge: 10 * 60 * 1000 });
  }

  /* ---------------- today's plans and alarms ---------------- */

  function todaysPlans(){
    const k = keyOf(new Date());
    const list = (window.__planOn ? window.__planOn(k) : []) || [];
    return list;
  }
  function nextAlarm(){
    return window.__nextAlarm ? window.__nextAlarm() : null;
  }

  /* ---------------- render ---------------- */

  function greeting(){
    const h = new Date().getHours();
    if(h < 5)  return 'おそくまでおつかれさま';
    if(h < 11) return 'おはよう';
    if(h < 17) return 'こんにちは';
    if(h < 22) return 'こんばんは';
    return 'こんばんは';
  }

  function render(){
    const now = new Date();
    const w = data.wx;
    const s = w ? sky(w.code) : null;
    const plans = todaysPlans();
    const alarm = nextAlarm();

    app.innerHTML = `
      <div class="home-stage ${skyNow().cls}" id="hmStage">
        ${skyHtml()}
        <div class="home-date">
          <span class="hd-md">${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()}</span>
          <span class="hd-wd">${WD_EN[idxOf(now)]}</span>
        </div>
        ${yardHtml()}
        <span class="walker" id="hmDog">${window.__DOG_SVG || ''}</span>
        <div class="dog-bubble sess hide" id="hmBubble"></div>
      </div>

      <div class="home-card wx ${w ? 'has' : ''}">
        ${w ? `
          <div class="wx-line">
          <div class="wx-art ${s.key}">${skyArt(s.key)}</div>
          <div class="wx-body">
            <div class="wx-label">${esc(s.label)}</div>
            <div class="wx-temp">${w.temp != null ? w.temp + '°' : '—'}</div>
            <div class="wx-sub">
              ${w.hi != null ? `<span class="hi">↑${w.hi}°</span>` : ''}
              ${w.lo != null ? `<span class="lo">↓${w.lo}°</span>` : ''}
              ${w.pop != null ? `<span class="pop">☂ ${w.pop}%</span>` : ''}
            </div>
          </div>
          <div class="wx-place">
            <button class="mini-btn" id="hmPlace">${esc((data.place && data.place.name) || '場所')}</button>
            <button class="mini-btn" id="hmReload" ${busy ? 'disabled' : ''}>${busy ? '…' : '更新'}</button>
          </div>
          </div>
        ` : `
          <div class="wx-line">
            <div class="wx-art cloud">${skyArt('part')}</div>
            <div class="wx-body">
              <div class="wx-label">Today's weather</div>
              <div class="wx-sub">場所を決めると、ここに出ます。</div>
            </div>
            <div class="wx-place"><button class="mini-btn solid" id="hmPlace">場所を決める</button></div>
          </div>
        `}
        ${placeOpen ? `
          <div class="wx-picker">
            <input type="text" id="hmCity" placeholder="市区町村を入れる（例: 横浜）" value="">
            <button class="mini-btn solid" id="hmFind">さがす</button>
            <button class="mini-btn" id="hmHere">現在地</button>
          </div>
          ${hits.length ? `<div class="wx-hits">
            <div class="wx-hits-t">どれですか？</div>
            ${hits.map((h, i) => `<button class="mini-btn" data-hit="${i}">${esc(placeName(h))}${
              h.population >= 10000 ? `<span class="pop-n">${Math.round(h.population / 10000)}万人</span>` : ''}</button>`).join('')}
          </div>` : ''}` : ''}
        ${msg ? `<div class="wx-msg">${esc(msg)}</div>` : ''}
      </div>

      ${alarm ? `
      <button class="home-card alarm" id="hmAlarm">
        <span class="al-when">${esc(alarm.time || '—')}</span>
        <span class="al-body">
          <span class="al-title">${esc(alarm.label)}</span>
          <span class="al-meta">つぎのアラーム${alarm.today ? '' : '（あす）'}</span>
        </span>
        <span class="al-go">Ready ↓</span>
      </button>` : ''}

      <div>
        <div class="section-title">
          <span>Today's plans</span>
          <span class="tools"><button class="mini-btn" id="hmAll">Schedule →</button></span>
        </div>
        ${plans.length ? `<div class="home-plans">
          ${plans.map(e => {
            const c = typeOf(e.type).color;
            return `<button class="home-plan" data-plan="${esc(e.id)}"
              style="--c:${c}; --cb:${tint(c, 0.13)}">
              <span class="hp-time">${e.allDay ? '終日' : esc(e.start || '—')}${(!e.allDay && e.end) ? '–' + esc(e.end) : ''}</span>
              <span class="hp-title">${esc(e.title)}</span>
              ${e.note ? `<span class="hp-note">${esc(e.note)}</span>` : ''}
            </button>`;
          }).join('')}
        </div>` : `<div class="empty-state">今日の予定はありません。<br>ゆっくりいきましょう。</div>`}
      </div>
    `;

    const on = (id, fn) => { const el = $id(id); if(el) el.addEventListener('click', fn); };
    on('hmPlace', () => { placeOpen = !placeOpen; msg = null; hits = []; render();
      const el = $id('hmCity'); if(el) el.focus(); });
    on('hmReload', () => loadWeather(true));
    on('hmFind', () => { const el = $id('hmCity'); findPlace(el ? el.value : ''); });
    on('hmHere', useHere);
    $qa('[data-hit]').forEach(b => b.addEventListener('click', () => {
      const h = hits[parseInt(b.dataset.hit, 10)];
      if(h) pickPlace(h);
    }));
    on('hmAll', () => PAWS.setTab('cal'));
    on('hmAlarm', () => {
      const el = document.getElementById('paneFm');
      if(el) el.scrollIntoView({ block:'start', behavior:'smooth' });
    });
    $qa('[data-plan]').forEach(b => b.addEventListener('click', () => {
      if(window.__openPlan) window.__openPlan(b.dataset.plan);
      PAWS.setTab('cal');
    }));
    const city = $id('hmCity');
    if(city) city.addEventListener('keydown', ev => { if(ev.key === 'Enter') findPlace(city.value); });
    startDog();
  }

  /* ---------------- the dog on the stage ---------------- */

  const GREET = () => {
    const h = new Date().getHours();
    if(h < 5)  return 'まだ起きてるの？';
    if(h < 11) return 'おはよう';
    if(h < 17) return 'こんにちは';
    return 'こんばんは';
  };
  const MURMURS = [
    'いい天気だね', 'お散歩いきたい', 'きょうも いっしょに', 'おなかすいた',
    'おやつほしい', 'ワクワク', 'そばにいるよ', 'ひなたぼっこ', 'ふぁ〜あ',
    'なでて', 'たのしみだね', 'ゆっくりいこう', 'はじめの一歩',
    'ちょっと休憩する？', 'えらいね', 'その調子', 'まっててあげる',
    'いい匂いがする', 'しっぽ ふりふり', 'きょうは何する？', 'あくび でちゃった',
    'ボールで あそぼ', 'ねむくなってきた', 'ふんふん', 'ここにいるよ',
    'あわてなくて いいよ', '一歩ずつ ね', 'そろそろ おやつ？'
  ];
  const PAW_TAG = '<span class="bpaw"></span>';

  let dogX = 0.5, dogDir = -1, dogTimer = null, dogStop = 0;
  let bubbleUntil = 0, nextBubble = 0, greeted = false, bubbleText = '';
  let nextBf = 0, nextSeason = 0, nextStar = 0;
  let pups = [];                 // { el, gap }
  let pupsUntil = 0, nextPups = Date.now() + 20000 + Math.random() * 40000;
  const COATS = ['coat-beige', 'coat-black', 'coat-brown'];

  /* ---------------- the little yard ---------------- */

  // Foliage follows the season, the way the falling petals do.
  function leafTone(){
    const sea = (window.__SEASON && window.__SEASON.season()) || 'fireworks';
    if(sea === 'blossom')  return { a:'#E9C2CE', b:'#DCAFBE', snow:false };
    if(sea === 'leaves')   return { a:'#D6A65E', b:'#C4863F', snow:false };
    if(sea === 'snow')     return { a:'#BFC8C0', b:'#AAB5AC', snow:true  };
    return { a:'#A6C08D', b:'#8FAC79', snow:false };   // summer green
  }

  function treeSvg(tone, tall){
    const cap = tone.snow
      ? '<ellipse cx="20" cy="15" rx="12" ry="6" fill="#F2F4F0" opacity=".85"/>' : '';
    return `<svg viewBox="0 0 40 ${tall ? 54 : 44}" aria-hidden="true">
      <rect x="18" y="${tall ? 30 : 24}" width="4" height="${tall ? 24 : 20}" rx="2" fill="#B79A73"/>
      <circle cx="20" cy="${tall ? 20 : 18}" r="13" fill="${tone.a}"/>
      <circle cx="11" cy="${tall ? 26 : 23}" r="9" fill="${tone.b}"/>
      <circle cx="29" cy="${tall ? 26 : 23}" r="9" fill="${tone.b}"/>
      ${cap}
    </svg>`;
  }

  // Firs keep their green all year; only the snow settles on them.
  function firSvg(tone, tall){
    const h = tall ? 58 : 46;
    const k = tall ? 1 : 0.79;
    const y = v => (v * k).toFixed(1);
    const cap = tone.snow ? `
      <path d="M20 ${y(6)} 26 ${y(17)}H14z" fill="#F2F4F0" opacity=".9"/>
      <path d="M20 ${y(20)} 27 ${y(30)}H13z" fill="#F2F4F0" opacity=".75"/>` : '';
    return `<svg viewBox="0 0 40 ${h}" aria-hidden="true">
      <rect x="18.5" y="${y(44)}" width="3.5" height="${y(14)}" rx="1.8" fill="#B79A73"/>
      <path d="M20 ${y(3)} 32 ${y(24)}H8z" fill="#9BB584"/>
      <path d="M20 ${y(16)} 35 ${y(37)}H5z" fill="#8AA773"/>
      <path d="M20 ${y(28)} 37 ${y(48)}H3z" fill="#9BB584"/>
      ${cap}
    </svg>`;
  }

  const HOUSE_SVG = `<svg viewBox="0 0 46 38" aria-hidden="true">
    <path d="M23 3 44 17H2z" fill="#C2938F"/>
    <rect x="7" y="16" width="32" height="21" rx="2.5" fill="#E6CDCB"/>
    <path d="M23 20c4.4 0 7 3.2 7 7.4V37H16v-9.6c0-4.2 2.6-7.4 7-7.4z" fill="#8A6663"/>
    <circle cx="23" cy="13" r="1.8" fill="#F6E9E7"/>
  </svg>`;

  const GRASS_SVG = `<svg viewBox="0 0 18 12" aria-hidden="true">
    <g stroke="#A9BE94" stroke-width="1.7" stroke-linecap="round" fill="none">
      <path d="M4 12c0-4 1-6 2.5-7.5"/><path d="M9 12c0-5 .4-7.5.4-9"/><path d="M14 12c0-4-1-6-2.5-7.5"/>
    </g>
  </svg>`;

  function flowerSvg(c){
    return `<svg viewBox="0 0 14 18" aria-hidden="true">
      <path d="M7 18v-7" stroke="#A9BE94" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <g fill="${c}">
        <circle cx="7" cy="5" r="2.4"/><circle cx="3.6" cy="7.4" r="2.4"/>
        <circle cx="10.4" cy="7.4" r="2.4"/><circle cx="4.9" cy="10.6" r="2.4"/>
        <circle cx="9.1" cy="10.6" r="2.4"/>
      </g>
      <circle cx="7" cy="8" r="1.7" fill="#F2E3B8"/>
    </svg>`;
  }

  // Fixed spots, so the yard looks the same every time you come home.
  const YARD = [
    { k:'tree',   x:  6, w:44, tall:true  },
    { k:'grass',  x: 16, w:16 },
    { k:'flower', x: 21, w:12, c:'#E8B3C1' },
    { k:'fir',    x: 27, w:30, tall:false },
    { k:'house',  x: 39, w:38 },
    { k:'grass',  x: 50, w:14 },
    { k:'flower', x: 56, w:11, c:'#EBD08A' },
    { k:'tree',   x: 65, w:34, tall:false },
    { k:'grass',  x: 74, w:15 },
    { k:'flower', x: 80, w:12, c:'#C8AFD8' },
    { k:'fir',    x: 91, w:38, tall:true  },
    { k:'grass',  x: 98, w:13 }
  ];

  function yardHtml(){
    const tone = leafTone();
    return '<div class="stage-ground"></div>' + YARD.map(o => {
      const art = o.k === 'tree'   ? treeSvg(tone, o.tall)
                : o.k === 'fir'    ? firSvg(tone, o.tall)
                : o.k === 'house'  ? HOUSE_SVG
                : o.k === 'flower' ? flowerSvg(o.c)
                : GRASS_SVG;
      return `<span class="scene ${o.k}" style="left:${o.x}%; width:${o.w}px">${art}</span>`;
    }).join('');
  }

  // The sky over the yard: pale blue by day, warm at dusk, deep at night.
  function skyNow(){
    const d = new Date();
    const t = d.getHours() + d.getMinutes() / 60;
    if(t >= 5 && t < 17){
      const k = (t - 5) / 12;                       // the sun's arc, 5:00 → 17:00
      return { cls:'day', orb:'sun', x: 8 + k * 84, y: 54 - Math.sin(Math.PI * k) * 20 };
    }
    if(t >= 17 && t < 19){
      const k = (t - 17) / 2;
      return { cls:'dusk', orb:'sun', x: 78 + k * 14, y: 46 + k * 22 };
    }
    const k = ((t + 5) % 24) / 24;
    return { cls:'night', orb:'moon', x: 81, y: 44 };
  }

  function skyHtml(){
    const s = skyNow();
    return `<span class="orb ${s.orb}" style="left:${s.x.toFixed(1)}%; top:${s.y.toFixed(0)}px"></span>`;
  }

  function stage(){ return $id('hmStage'); }

  function paintDog(){
    const st = stage();
    const dog = $id('hmDog');
    if(!st || !dog) return;
    const W = st.clientWidth || 300;
    const H = st.clientHeight || 150;
    const x = 26 + dogX * (W - 52);
    const y = H - 17;              // its paws land on the ground line
    dog.className = 'walker' + (dogStop ? ' still' : '');
    dog.style.transform = 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px)'
                        + (dogDir < 0 ? ' scaleX(-1)' : '');
    // the pups walk in the parent's wake
    pups.forEach(p => {
      const px = Math.max(8, Math.min(W - 8, x - dogDir * p.gap));
      p.el.style.transform = 'translate(' + px.toFixed(1) + 'px, ' + (H - 13).toFixed(1) + 'px)'
                           + (dogDir < 0 ? ' scaleX(-1)' : '');
    });
    const bub = $id('hmBubble');
    if(bub){
      bub.style.left = x.toFixed(1) + 'px';
      bub.style.top  = (y - 20).toFixed(1) + 'px';
      bub.classList.toggle('flip', x > W * 0.6);
    }
  }

  function dogTick(){
    const st = stage();
    if(!st || app.hidden || (app.offsetParent === null)) return;
    const now = Date.now();

    if(dogStop){
      if(now > dogStop) dogStop = 0;
    } else {
      dogX += dogDir * 0.018;
      if(dogX <= 0){ dogX = 0; dogDir = 1; }
      if(dogX >= 1){ dogX = 1; dogDir = -1; }
      // every so often it just stands there, tail going
      if(Math.random() < 0.01) dogStop = now + 3000 + Math.random() * 4000;
    }

    // now and then the pups come along for a while
    if(!pups.length && now > nextPups){
      const n = 1 + Math.floor(Math.random() * 2);
      for(let i = 0; i < n; i++){
        const el = document.createElement('div');
        el.className = 'walker pup ' + (i ? 'p2 ' : '') + COATS[Math.floor(Math.random() * COATS.length)];
        el.innerHTML = window.__DOG_SVG || '';
        st.appendChild(el);
        pups.push({ el: el, gap: 22 + i * 16 });
      }
      pupsUntil = now + 30000 + Math.random() * 40000;
    }
    if(pups.length && now > pupsUntil){
      pups.forEach(p => {
        p.el.style.transition = 'opacity .8s ease';
        p.el.style.opacity = '0';
        setTimeout(() => p.el.remove(), 900);
      });
      pups = [];
      nextPups = now + 90000 + Math.random() * 120000;
    }
    paintDog();

    // what it has to say
    const bub = $id('hmBubble');
    if(bub){
      if(bubbleUntil && now > bubbleUntil){
        bub.classList.add('hide');
        bubbleUntil = 0;
        nextBubble = now + 9000 + Math.random() * 12000;
      } else if(!bubbleUntil && now > nextBubble){
        const text = greeted ? MURMURS[Math.floor(Math.random() * MURMURS.length)] : GREET();
        greeted = true;
        bubbleText = text;
        bub.innerHTML = text + PAW_TAG;
        bub.classList.remove('hide');
        bubbleUntil = now + 6500;
      }
    }

    if(reduced()) return;

    // a butterfly, from time to time
    if(now > nextBf){
      nextBf = now + 22000 + Math.random() * 30000;
      if(window.__SEASON){
        const b = document.createElement('div');
        b.className = 'butterfly';
        b.innerHTML = window.__SEASON.butterflySvg();
        const W = st.clientWidth || 300, H = st.clientHeight || 150;
        b.style.setProperty('--x', (10 + Math.random() * (W - 40)).toFixed(0) + 'px');
        b.style.setProperty('--y', (H * 0.42 + Math.random() * 26).toFixed(0) + 'px');
        b.style.setProperty('--dx', ((Math.random() - 0.5) * W * 0.8).toFixed(0) + 'px');
        b.style.setProperty('--dy', (-30 - Math.random() * 45).toFixed(0) + 'px');
        window.__SEASON.guest(st, b, 6800);
      }
    }

    // the season, in its own time
    if(now > nextSeason){
      nextSeason = now + 4 * 60000 + Math.random() * 3 * 60000;
      const S = window.__SEASON;
      if(S){
        const season = S.season();
        if(season === 'fireworks'){
          const n = 2 + Math.floor(Math.random() * 2);
          for(let i = 0; i < n; i++) setTimeout(() => S.firework(st), i * (600 + Math.random() * 700));
        } else {
          const n = 3 + Math.floor(Math.random() * 4);
          for(let i = 0; i < n; i++) S.drift(st, season, i * (0.25 + Math.random() * 0.5));
        }
      }
    }

    // and a shooting star, late on
    const h = new Date().getHours();
    if((h >= 18 || h < 2) && now > nextStar){
      nextStar = now + 20000 + Math.random() * 30000;
      if(window.__SEASON){
        window.__SEASON.streak(st);
        if(Math.random() < 0.3) setTimeout(() => window.__SEASON.streak(st), 700 + Math.random() * 600);
      }
    }
  }

  function reduced(){
    return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  }

  function startDog(){
    if(dogTimer) clearInterval(dogTimer);
    const st = stage(), dog = $id('hmDog');
    // The stage is built afresh on every render. Place everyone first, with
    // the movement turned off, so nobody appears to fall in from the corner.
    if(st && dog){
      pups = pups.filter(p => p.el);
      pups.forEach(p => st.appendChild(p.el));
      const movers = [dog].concat(pups.map(p => p.el));
      movers.forEach(el => { el.style.transition = 'none'; });
      paintDog();
      void dog.offsetWidth;                       // let the placement settle
      movers.forEach(el => { el.style.transition = ''; });
      const bub = $id('hmBubble');
      if(bub && bubbleUntil > Date.now() && bubbleText){
        bub.innerHTML = bubbleText + PAW_TAG;
        bub.style.transition = 'none';
        bub.classList.remove('hide');
        void bub.offsetWidth;
        bub.style.transition = '';
      }
    }
    dogTimer = setInterval(dogTick, 250);
  }

  PAWS.register('home', {
    gistFile: null,          // nothing here is worth carrying between devices
    appId: 'home',
    payload: null,
    merge: () => false,
    rerender: () => render()
  });

  render();
  if(data.place) loadWeather(false);
  // the day turns, the greeting with it
  setInterval(() => { if(app.offsetParent !== null) render(); }, 60 * 1000);
  setInterval(() => { if(data.place) loadWeather(false); }, 15 * 60 * 1000);
})();

</script>

<script>
PAWS.initShell();
</script>
