  function spawnStreak(){
    const dial = document.querySelector('.dial-wrap');
    if(!dial) return;
    const el = document.createElement('div');
    el.innerHTML = SEASON_ART.stars();
    el.className = 'season streak';
    el.style.setProperty('--x', (-30 + Math.random() * 90).toFixed(0) + 'px');
    el.style.setProperty('--y', (-10 + Math.random() * 110).toFixed(0) + 'px');
    el.style.setProperty('--dx', (210 + Math.random() * 90).toFixed(0) + 'px');
    el.style.setProperty('--dy', (120 + Math.random() * 80).toFixed(0) + 'px');
    el.style.setProperty('--ang', (26 + Math.random() * 12).toFixed(0) + 'deg');
    el.style.width = '110px';
    dial.appendChild(el);
    setTimeout(() => el.remove(), 2200);
  }

  function seasonalTick(){
    if(data.phase !== 'working') return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const now = Date.now();
    const season = currentSeason();

    if(season === 'stars'){
      if(now - lastSeasonal < 300000) return;            // about once every five minutes
      lastSeasonal = now;
      spawnStreak();
      if(Math.random() < 0.15) setTimeout(spawnStreak, 800 + Math.random() * 600);
      return;
    }

    // petals, leaves and snow come down in little flurries
    if(now - lastSeasonal < 5200) return;
    lastSeasonal = now;
    const n = 3 + Math.floor(Math.random() * 4);          // 3–6 at a time
    for(let i = 0; i < n; i++) spawnDrift(season, i * (0.25 + Math.random() * 0.5));
  }

  /* ---------------- derived stats ---------------- */

  function computeStats(){
    const logs = data.logs || [];
    const todayLogs = logs.filter(l => isToday(l.ts));
    const todayAvg = todayLogs.length ? todayLogs.reduce((a,b)=>a+b.elapsed,0)/todayLogs.length : null;
    let allFastest = null, bestTs = null;
    logs.forEach(l => { if(allFastest === null || l.elapsed < allFastest){ allFastest = l.elapsed; bestTs = l.ts; } });
    const todaySessions = (data.sessions || []).filter(s => isToday(s.ts));
    const todayWork = todaySessions.reduce((a,b)=>a + (b.work || 0), 0);
    const byType = {};
    typeList().forEach(t => { byType[t.id] = 0; });
    todaySessions.forEach(s => {
      const seg = s.segments && Object.keys(s.segments).length
        ? s.segments
        : { [s.type || 'WORK']: s.work || 0 };
      Object.keys(seg).forEach(k => { byType[k] = (byType[k] || 0) + seg[k]; });
    });
    const successCount = logs.filter(l => l.elapsed <= data.thresholdSec).length;
    const successRate = logs.length ? Math.round((successCount / logs.length) * 100) : null;
    return { todayAvg, allFastest, bestTs, todayWork, successRate, byType, sessionCount: todaySessions.length };
  }

  // ---- history chart: day / week / month, pageable ----

  const CHART_SPAN = { day: 14, week: 12, month: 12 };

  function startOfDay(d){ const x = new Date(d); x.setHours(0,0,0,0); return x; }
  function startOfWeek(d){                     // weeks start on Monday
    const x = startOfDay(d);
    const wd = (x.getDay() + 6) % 7;
    x.setDate(x.getDate() - wd);
    return x;
  }
  function startOfMonth(d){ const x = startOfDay(d); x.setDate(1); return x; }

  function bucketStarts(){
    const mode = data.chartMode || 'day';
    const off = data.chartOffset || 0;
    const n = CHART_SPAN[mode];
    const out = [];
    if(mode === 'day'){
      const end = startOfDay(new Date());
      end.setDate(end.getDate() - off * n);
      for(let i = n - 1; i >= 0; i--){
        const d = new Date(end); d.setDate(d.getDate() - i); out.push(d);
      }
    } else if(mode === 'week'){
      const end = startOfWeek(new Date());
      end.setDate(end.getDate() - off * n * 7);
      for(let i = n - 1; i >= 0; i--){
        const d = new Date(end); d.setDate(d.getDate() - i * 7); out.push(d);
      }
    } else {
      const end = startOfMonth(new Date());
      end.setMonth(end.getMonth() - off * n);
      for(let i = n - 1; i >= 0; i--){
        const d = new Date(end); d.setMonth(d.getMonth() - i); out.push(d);
      }
    }
    return out;
  }

  function bucketEnd(start){
    const mode = data.chartMode || 'day';
    const e = new Date(start);
    if(mode === 'day') e.setDate(e.getDate() + 1);
    else if(mode === 'week') e.setDate(e.getDate() + 7);
    else e.setMonth(e.getMonth() + 1);
    return e;
  }

  function bucketLabel(start){
    const mode = data.chartMode || 'day';
    const m = start.getMonth() + 1, d = start.getDate();
    if(mode === 'month') return m + '月';
    return m + '/' + d;
  }

  function rangeLabel(starts){
    if(!starts.length) return '';
    const a = starts[0], b = bucketEnd(starts[starts.length - 1]);
    b.setDate(b.getDate() - 1);
    const f = (x) => (x.getMonth() + 1) + '/' + x.getDate();
    const mode = data.chartMode || 'day';
    if(mode === 'month'){
      const g = (x) => String(x.getFullYear()).slice(2) + '/' + (x.getMonth() + 1);
      return g(a) + ' – ' + g(b);
    }
    return f(a) + ' – ' + f(b);
  }

  function collectBuckets(){
    const starts = bucketStarts();
    const rows = starts.map(st => ({
      start: st,
      end: bucketEnd(st),
      total: 0,
      byType: {},
      n: 0
    }));
    (data.sessions || []).forEach(s => {
      for(const r of rows){
        if(s.ts >= r.start.getTime() && s.ts < r.end.getTime()){
          r.total += s.work || 0;
          const seg = s.segments && Object.keys(s.segments).length
            ? s.segments
            : { [s.type || 'WORK']: s.work || 0 };
          Object.keys(seg).forEach(k => { r.byType[k] = (r.byType[k] || 0) + seg[k]; });
          r.n += 1;
          break;
        }
      }
    });
    return rows;
  }

  function fmtHours(sec){
    const h = sec / 3600;
    if(h >= 1) return h.toFixed(h >= 10 ? 0 : 1) + 'h';
    return Math.round(sec / 60) + 'm';
  }

  function renderChart(){
    const mode = data.chartMode || 'day';
    const off = data.chartOffset || 0;
    const rows = collectBuckets();
    const anyData = (data.sessions || []).length > 0;
    const total = rows.reduce((a, r) => a + r.total, 0);

    const modes = ['day','week','month'];
    const modeLabel = { day: 'D', week: 'W', month: 'M' };
    const head = `
      <div class="chart-head">
        <span class="t">Work time</span>
        <span class="chart-tools">
          ${modes.map(m => `<button class="mode-btn ${mode === m ? 'on' : ''}" data-mode="${m}">${modeLabel[m]}</button>`).join('')}
        </span>
      </div>
      <div class="chart-nav">
        <button class="nav-btn" id="chartPrev" title="前へ">‹</button>
        <span class="range">${rangeLabel(rows.map(r => r.start))}</span>
        <button class="nav-btn" id="chartNext" title="次へ" ${off === 0 ? 'disabled' : ''}>›</button>
      </div>`;

    if(!anyData){
      return `<div class="chart-card">${head}
        <div class="chart-empty">Finish a session and your<br>totals will appear here.</div>
      </div>`;
    }

    const goal = data.workGoalSec;
    const goalPerBucket = mode === 'day' ? goal : null;
    const maxVal = Math.max(
      ...rows.map(r => r.total),
      goalPerBucket ? goalPerBucket * 1.25 : 1
    ) || 1;

    const cols = rows.map(r => {
      const hPct = r.total > 0 ? Math.max((r.total / maxVal) * 100, 2) : 0;
      const keys = Object.keys(r.byType).filter(k => r.byType[k] > 0);
      const segs = keys
        .map(k => `<i style="height:${(r.byType[k] / r.total * 100).toFixed(1)}%;background:${typeColor(k)}"></i>`)
        .join('');
      const detail = keys.map(k => `${typeLabel(k)} ${fmtElapsed(r.byType[k])}`).join(' · ');
      const tip = `${bucketLabel(r.start)} · ${fmtElapsed(r.total)}${detail ? ' · ' + detail : ''}`;
      const hit = goalPerBucket && r.total >= goalPerBucket;
      return `<div class="bar-col"><div class="bar-slot">
        <div class="bar ${hit ? 'hit' : ''}" style="height:${hPct}%" title="${tip}">${segs}</div>
      </div></div>`;
    }).join('');

    const labels = rows.map(r => `<span>${bucketLabel(r.start)}</span>`).join('');

    return `<div class="chart-card">${head}
      <div class="chart-body">
        ${goalPerBucket ? `<div class="goal-line" style="top:${((1 - goalPerBucket / maxVal) * 100).toFixed(1)}%"><span class="goal-tag">${fmtHours(goalPerBucket)}</span></div>` : ''}
        <div class="bars">${cols}</div>
      </div>
      <div class="day-labels">${labels}</div>
      <div class="chart-foot">total ${fmtElapsed(total)}</div>
    </div>`;
  }

  // ---- manual entry and editing of sessions ----

  function pad2(n){ return String(n).padStart(2, '0'); }
  function dateValue(ts){
    const d = new Date(ts);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function timeValue(ts){
    const d = new Date(ts);
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function blankSession(){
    return {
      ts: Date.now(),
      type: data.taskType || typeList()[0].id,
      segments: null,
      initial: 0,
      work: (data.workGoalSec || 1500),
      rest: 0
    };
  }

  function renderSessionEditor(){
    if(editIndex === null) return '';
    const isNew = editIndex === 'new';
    const s = isNew ? blankSession() : (data.sessions || [])[editIndex];
    if(!s) return '';
    const wh = Math.floor((s.work || 0) / 3600);
    const wm = Math.round(((s.work || 0) % 3600) / 60);
    const bm = Math.round((s.rest || 0) / 60);
    const im = Math.floor((s.initial || 0) / 60);
    const isec = Math.round((s.initial || 0) % 60);

    return `<div class="sess-editor">
      <div class="se-title">${isNew ? 'New session' : 'Edit session'}</div>

      <div class="se-field">
        <label>Date</label>
        <input type="date" id="seDate" value="${dateValue(s.ts)}">
        <input type="time" id="seTime" value="${timeValue(s.ts)}">
      </div>

      <div class="se-field">
        <label>Type</label>
        <select id="seType">
          ${typeList().map(t => `<option value="${t.id}" ${s.type === t.id ? 'selected' : ''}>${t.label}</option>`).join('')}
        </select>
      </div>

      <div class="se-field">
        <label>Work</label>
        <input type="number" id="seWorkH" min="0" max="23" value="${wh}"><span class="unit">h</span>
        <input type="number" id="seWorkM" min="0" max="59" value="${wm}"><span class="unit">m</span>
      </div>

      <div class="se-field">
        <label>Break</label>
        <input type="number" id="seRestM" min="0" max="600" value="${bm}"><span class="unit">m</span>
      </div>

      <div class="se-field">
        <label>First move</label>
        <input type="number" id="seInitM" min="0" max="600" value="${im}"><span class="unit">m</span>
        <input type="number" id="seInitS" min="0" max="59" value="${isec}"><span class="unit">s</span>
      </div>

      <div class="se-actions">
        <button class="se-save" id="seSave">SAVE</button>
        ${isNew ? '' : '<button class="se-del" id="seDel">DELETE</button>'}
        <button class="se-cancel" id="seCancel">CANCEL</button>
      </div>
    </div>`;
  }

  function num(id, fallback){
    const el = document.getElementById(id);
    const v = el ? parseInt(el.value, 10) : NaN;
    return isNaN(v) || v < 0 ? fallback : v;
  }

  async function onSessionSave(){
    const isNew = editIndex === 'new';
    const base = isNew ? blankSession() : Object.assign({}, (data.sessions || [])[editIndex]);
    if(!base) return;

    const dv = (document.getElementById('seDate') || {}).value || dateValue(base.ts);
    const tv = (document.getElementById('seTime') || {}).value || timeValue(base.ts);
    const ts = new Date(dv + 'T' + tv).getTime();

    const typeEl = document.getElementById('seType');
    const newType = typeEl ? typeEl.value : base.type;
    const work = num('seWorkH', 0) * 3600 + num('seWorkM', 0) * 60;
    const rest = num('seRestM', 0) * 60;
    const initial = num('seInitM', 0) * 60 + num('seInitS', 0);

    // Keep the per-type split sensible when the total or the type changes.
    let segments;
    const old = base.segments && Object.keys(base.segments).length ? base.segments : null;
    if(!old || newType !== base.type || Object.keys(old).length === 1){
      segments = { [newType]: work };
    } else {
      const oldTotal = Object.values(old).reduce((a, b) => a + b, 0);
      const k = oldTotal > 0 ? work / oldTotal : 0;
      segments = {};
      Object.keys(old).forEach(key => { segments[key] = old[key] * k; });
    }

    const rec = {
      ts: isNaN(ts) ? base.ts : ts,
      type: newType,
      segments: segments,
      initial: initial,
      work: work,
      rest: rest
    };

    data.sessions = data.sessions || [];
    if(isNew) data.sessions.push(rec);
    else data.sessions[editIndex] = rec;

    editIndex = null;
    await saveData();
    render();
  }

  async function onSessionDelete(){
    if(editIndex === null || editIndex === 'new') return;
    if(!confirm('Delete this session?')) return;
    data.sessions.splice(editIndex, 1);
    editIndex = null;
    await saveData();
    render();
  }

  // ---- the current week, one paw per day ----

  // The day flips at 05:00, and the week starts Monday at 05:00 —
  // so a late night still counts towards the day it started in.
  const DAY_FLIP_HOUR = 5;

  function dayStart5(when){
    const x = new Date(when);
    if(x.getHours() < DAY_FLIP_HOUR) x.setDate(x.getDate() - 1);
    x.setHours(DAY_FLIP_HOUR, 0, 0, 0);
    return x;
  }
  function weekStart5(when){
    const x = dayStart5(when);
    const wd = (x.getDay() + 6) % 7;      // 0 = Monday
    x.setDate(x.getDate() - wd);
    return x;
  }

  function weekPaws(){
    const currentDay = dayStart5(new Date());
    const monday = weekStart5(new Date());
    const letters = ['M','T','W','T','F','S','S'];
    // Mon → Sun, each with its own muted shade
    const colors  = ['#A8C075','#C9913F','#7FAEBE','#C7929F','#D3BA55','#6B84AE','#AB5F63'];
    const out = [];
    for(let i = 0; i < 7; i++){
      const d = new Date(monday); d.setDate(d.getDate() + i);
      const next = new Date(d); next.setDate(next.getDate() + 1);
      let total = 0;
      (data.sessions || []).forEach(s => {
        if(s.ts >= d.getTime() && s.ts < next.getTime()) total += s.work || 0;
      });
      out.push({
        date: d,
        letter: letters[i],
        color: colors[i],
        total: total,
        met: total >= data.workGoalSec,
        today: d.getTime() === currentDay.getTime()
      });
    }
    return out;
  }

  const PAW_PATHS = `
    <ellipse cx="20" cy="25" rx="8.6" ry="7"/>
    <ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/>
    <ellipse cx="16.5" cy="8" rx="3.7" ry="5"/>
    <ellipse cx="24.5" cy="8" rx="3.7" ry="5"/>
    <ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/>`;

  let stampedDays = null;   // days already stamped in this view, so it animates once

  function renderWeekPaws(){
    const days = weekPaws();
    const metKeys = days.filter(d => d.met).map(d => d.date.getTime());
    const firstPass = stampedDays === null;
    const fresh = firstPass ? [] : metKeys.filter(k => !stampedDays.includes(k));
    stampedDays = metKeys;
    return `<div class="week-paws">
      ${days.map(d => `
        <div class="week-paw ${d.met ? 'on' : ''} ${fresh.includes(d.date.getTime()) ? 'stamp' : ''} ${d.today ? 'today' : ''}"
             style="color:${d.color}"
             title="${d.letter} ${(d.date.getMonth()+1)}/${d.date.getDate()} · ${d.total > 0 ? fmtElapsed(d.total) : 'no sessions'}">
          <svg viewBox="0 0 40 34" aria-hidden="true">${PAW_PATHS}</svg>
          <span class="wd">${d.letter}</span>
        </div>
      `).join('')}
    </div>`;
  }

  /* ---------------- render ---------------- */

  let banner = null;   // { text, celebrate }
  let typeEditing = false;
  let iconPickerFor = null;
  let editIndex = null;   // session index being edited, or 'new'
  let historyOpen = false;   // History starts collapsed

  function dialState(){
    const phase = data.phase;
    if(phase === 'ready'){
      const p = readyElapsed() / data.thresholdSec;
      const left = data.thresholdSec - readyElapsed();
      return {
        // Counts down to the goal, then counts up past it.
        main: left >= 0 ? fmtElapsed(left) : '+' + fmtElapsed(-left),
        label: left >= 0 ? 'getting ready' : 'over goal',
        progress: Math.min(p, 1),
        raw: p,
        color: ringColor(p),
        sub: null, lap: 0, dogClass: 'still', dogPos: 0, live: true
      };
    }
    if(phase === 'working' || phase === 'break'){
      const w = workElapsed();
      const p = w / data.workGoalSec;
      return {
        main: fmtElapsed(w),
        label: phase === 'break' ? 'on a break' : 'in session',
        progress: ((p % 1) + 1) % 1,
        raw: p,
        color: typeColor(data.taskType || 'WORK'),
        sub: phase === 'break' ? 'break ' + fmtElapsed(restElapsed())
                               : (restElapsed() > 0 ? 'break ' + fmtElapsed(restElapsed()) : null),
        lap: Math.floor(p),
        dogClass: phase === 'break' ? 'sit' : '',
        dogPos: p,
        live: phase === 'working'
      };
    }
    if(phase === 'done'){
      return {
        main: fmtElapsed(workElapsed()),
        label: 'finished',
        progress: Math.min(workElapsed() / data.workGoalSec, 1),
        raw: workElapsed() / data.workGoalSec,
        color: typeColor(data.taskType || 'WORK'),
        sub: restElapsed() > 0 ? 'break ' + fmtElapsed(restElapsed()) : null,
        lap: 0, dogClass: 'sit', dogPos: workElapsed() / data.workGoalSec, live: false
      };
    }
    return { main: '0:00', label: 'standing by', progress: 0, raw: 0,
             color: ringColor(0), sub: null, lap: 0, dogClass: 'still', dogPos: 0, live: false };
  }

  function buttonMarkup(){
    const phase = data.phase;
    if(phase === 'idle'){
      return `<button class="action-btn" id="readyBtn">READY...<svg class="btn-paw" viewBox="0 0 40 34" aria-hidden="true"><ellipse cx="20" cy="25" rx="8.6" ry="7"/><ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/><ellipse cx="16.5" cy="8" rx="3.7" ry="5"/><ellipse cx="24.5" cy="8" rx="3.7" ry="5"/><ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/></svg></button>`;
    }
    if(phase === 'ready'){
      const go = goButtonStyle(readyElapsed() / data.thresholdSec);
      return `<div class="checkin-wrap">
        <span class="halo" style="border-color:${go.halo}"></span>
        <span class="halo d2" style="border-color:${go.halo}"></span>
        <span class="halo d3" style="border-color:${go.halo}"></span>
        <button class="checkin-btn" id="goBtn" style="background:${go.background}; box-shadow:${go.shadow}">GO!<span class="go-steps">${ICON.steps}</span></button>
      </div>`;
    }
    if(phase === 'working'){
      return `<div class="btn-row">
        <button class="pill quiet" id="breakBtn"><span class="lbl">${ICON.coffee}BREAK</span></button>
        <button class="pill beige" id="finishBtn"><span class="lbl">${ICON.finish}FINISH</span></button>
      </div>`;
    }
    if(phase === 'break'){
      const tid = data.taskType || 'WORK';
      return `<div class="btn-row">
        <button class="pill primary" id="restartBtn"
                style="background:${typeGradient(tid)}; box-shadow:0 8px 20px -9px ${typeDeep(tid)}"><span class="lbl">${ICON.steps}ReSTART</span></button>
        <button class="pill beige" id="finishBtn"><span class="lbl">${ICON.finish}FINISH</span></button>
      </div>`;
    }
    // done
    const s = data.sessions && data.sessions.length ? data.sessions[data.sessions.length - 1] : null;
    const hitGoal = s && s.work >= data.workGoalSec;
    return `<div class="summary ${hitGoal ? 'gold' : ''}">
      ${hitGoal ? '<div class="medal">🏅</div>' : ''}
      <div class="big">${hitGoal ? 'Session complete!' : 'Well done.'}</div>
      <div class="small">${hitGoal ? 'You went the full distance.' : 'Every stretch counts.'}</div>
      <div class="rows">
        <div>start<b>${s ? fmtElapsed(s.initial) : '—'}</b></div>
        <div>work<b>${s ? fmtElapsed(s.work) : '—'}</b></div>
        <div>break<b>${s ? fmtElapsed(s.rest) : '—'}</b></div>
      </div>
      <button class="msg-reset" id="doneReset">RESET</button>
    </div>`;
  }

  function render(){
    const st = dialState();
    const stats = computeStats();
    const circumference = 2 * Math.PI * 108;
    const dashoffset = circumference * (1 - st.progress);
    const sessions = (data.sessions || [])
      .map((s, i) => ({ s, i }))
      .sort((a, b) => b.s.ts - a.s.ts)
      .slice(0, 12);

    app.innerHTML = `
      <div class="head-block">
      <h1>Ready When You Are</h1>
      <div class="paw-mark">
        <svg viewBox="0 0 40 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <ellipse cx="20" cy="25" rx="8.6" ry="7"/>
          <ellipse cx="9.5" cy="14.5" rx="4" ry="5.2" transform="rotate(-18 9.5 14.5)"/>
          <ellipse cx="16.5" cy="8" rx="3.7" ry="5"/>
          <ellipse cx="24.5" cy="8" rx="3.7" ry="5"/>
          <ellipse cx="31" cy="14.5" rx="4" ry="5.2" transform="rotate(18 31 14.5)"/>
        </svg>
      </div>
      <div class="sub">From the first move to the finish, let's time it.</div>
      </div>

      <div class="type-row">
        ${typeList().map(t => `
          <button class="type-btn ${data.taskType === t.id ? 'on' : ''}"
                  data-type="${t.id}"
                  ${data.phase === 'done' ? 'disabled' : ''}
                  style="${data.taskType === t.id ? `background:${typeGradient(t.id)}; box-shadow:0 6px 14px -7px ${shade(t.color, -8)}` : ''}">${t.label}</button>
        `).join('')}
        <button class="type-edit-btn ${typeEditing ? 'on' : ''}" id="typeEdit" title="種類を編集">✎</button>
      </div>

      ${typeEditing ? `<div class="type-editor">

        </div>
        <div style="height:8px"></div>
        ${historyOpen ? renderSessionEditor() : ''}
        ${!historyOpen ? '' : sessions.length ? `<div class="log-list">${sessions.map(({ s, i }) => `

    bind('readyBtn', onReady);

    const sg = document.getElementById('startGoalInput');
    if(sg) sg.addEventListener('change', onStartGoalChange);

    if(wg) wg.addEventListener('change', onWorkGoalChange);

    positionPack(st.dogPos);
    broadcastStatus();

  function bind(id, fn){
    const el = document.getElementById(id);
    if(el) el.addEventListener('click', fn);
  }

  /* ---------------- tick ---------------- */

  let warned = false;
  let butterfliesSeen = 0;

  function tick(){
    const phase = data.phase;
    if(phase !== 'ready') stopReminder();
    if(phase !== 'ready' && phase !== 'working' && phase !== 'break') return;

    const st = dialState();
    const circumference = 2 * Math.PI * 108;

    const fill = document.querySelector('.ring-fill');
    const clock = document.querySelector('.time-display');
    const label = document.querySelector('.state-label');
    const glow = document.querySelector('.glow');
    if(fill){
      fill.setAttribute('stroke', st.color);
      fill.setAttribute('stroke-dashoffset', circumference * (1 - st.progress));
    }
    if(clock) clock.textContent = st.main;
    if(label) label.textContent = st.label;
    if(glow) glow.style.background = `radial-gradient(circle, ${st.color} 0%, transparent 70%)`;

    const sub = document.querySelector('.sub-clock');
    if(sub && st.sub) sub.textContent = st.sub;

    if(phase === 'ready'){
      const remaining = data.thresholdSec - readyElapsed();
      // Same note throughout — only the spacing tightens as the goal nears.
      if(data.soundOn !== false) startReminder(nudgePlan(remaining).ms);

      const go = goButtonStyle(readyElapsed() / data.thresholdSec);
      const goBtn = document.getElementById('goBtn');
      if(goBtn){
        goBtn.style.background = go.background;
        goBtn.style.boxShadow = go.shadow;
      }
      document.querySelectorAll('.halo').forEach(h => { h.style.borderColor = go.halo; });
      positionWalker(0);
      return;
    }

    if(phase === 'working'){
      positionPack(st.dogPos);

      // Reaching the session goal
      if(!data.goalCelebrated && workElapsed() >= data.workGoalSec){
        data.goalCelebrated = true;
        banner = { text: `🎉 ${Math.round(data.workGoalSec/60)} minutes of work — goal reached!`, celebrate: true };
        saveData();
        render();
        playBigFanfare();
        celebrateGoal();
        return;
      }

      // Hour marks: one bell per hour, and a new puppy joins the walk
      const hours = Math.floor(workElapsed() / 3600);
      if(hours > (data.hoursChimed || 0)){
        data.hoursChimed = hours;
        playHourBell(hours);
        saveData();
        if(hours <= MAX_PUPS){ render(); return; }   // redraw so the puppy appears
      }

      // A butterfly drifts past every five minutes
      const flights = Math.floor(workElapsed() / 180);   // one every 3 minutes
      if(flights > butterfliesSeen){
        butterfliesSeen = flights;
        releaseButterfly();
      }

      // a new line of encouragement on the same beat
      if(flights !== cheerSlot){
        cheerSlot = flights;
        pickCheer();
        const el = document.getElementById('cheer');
        if(el){
          el.textContent = cheerText;
          el.style.animation = 'none';
          void el.offsetWidth;
          el.style.animation = '';
        } else {
          render();
        }
      }

      seasonalTick();

      // Lap badge appears as laps accumulate
      const badge = document.querySelector('.lap-badge');
      if(st.lap > 0 && !badge) render();
      else if(badge && st.lap > 0) badge.textContent = 'lap ' + (st.lap + 1);
    }
  }

  function startTicking(){
    stopTicking();
    tickHandle = setInterval(tick, 200);
  }

  let statusHandle = null;
  function startStatus(){
    if(statusHandle) return;
    statusHandle = setInterval(broadcastStatus, 1000);
  }
  function stopTicking(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }


  /* ---------------- status broadcast ---------------- */

  const BASE_TITLE = document.title;

  function broadcastStatus(){
    const st = dialState();
    const phase = data.phase;
    const running = phase === 'ready' || phase === 'working' || phase === 'break';
    const mark = phase === 'ready' ? '\u25CB'
               : phase === 'working' ? '\u25B6'
               : phase === 'break' ? '\u23F8' : '';

    // Tab title, so it's visible even when the window is behind something else
    document.title = running ? `${mark} ${st.main} \u2014 ${BASE_TITLE}` : BASE_TITLE;

    // Tell the host page (when embedded in an iframe)
    if(window.parent && window.parent !== window){
      try{
        window.parent.postMessage({
          source: 'startlog',
          phase: phase,
          type: data.taskType || 'WORK',
          main: st.main,
          label: st.label
        }, '*');
      } catch(e){ /* cross-origin host, ignore */ }
    }
  }

  // ---- backup: write the whole log to a file, and read it back ----

  function exportData(){
    const payload = {
      app: 'ready-when-you-are',
      version: 1,
      exportedAt: new Date().toISOString(),
      data: data
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const d = new Date();
    const stamp = d.getFullYear() + pad2(d.getMonth()+1) + pad2(d.getDate());
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `timelog-${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function importData(file){
    const reader = new FileReader();
    reader.onload = async () => {
      let incoming;
      try{
        const parsed = JSON.parse(reader.result);
        incoming = parsed && parsed.data ? parsed.data : parsed;
      } catch(e){
        alert('このファイルは読み込めませんでした。');
        return;
      }
      if(!incoming || !Array.isArray(incoming.sessions)){
        alert('記録が見つかりませんでした。');
        return;
      }

      const mine = (data.sessions || []).length;
      const theirs = incoming.sessions.length;
      const merge = mine > 0
        ? confirm(`読み込むファイルには ${theirs} 件の記録があります。\n\nOK: いまの ${mine} 件と統合する\nキャンセル: いまの記録を捨てて置き換える`)
        : false;

      if(merge){
        // same timestamp and length means the same session
        const seen = new Set((data.sessions || []).map(s => s.ts + ':' + Math.round(s.work || 0)));
        (incoming.sessions || []).forEach(s => {
          const key = s.ts + ':' + Math.round(s.work || 0);
          if(!seen.has(key)){ data.sessions.push(s); seen.add(key); }
        });
        const seenLogs = new Set((data.logs || []).map(l => l.ts + ':' + Math.round(l.elapsed || 0)));
        (incoming.logs || []).forEach(l => {
          const key = l.ts + ':' + Math.round(l.elapsed || 0);
          if(!seenLogs.has(key)){ data.logs.push(l); seenLogs.add(key); }
        });
        data.sessions.sort((a, b) => a.ts - b.ts);
        data.logs.sort((a, b) => a.ts - b.ts);
      } else {
        // keep the current session state, take everything else
        const live = {
          phase: data.phase, readyStart: data.readyStart, initialElapsed: data.initialElapsed,
          workStart: data.workStart, workAccum: data.workAccum, typeAccum: data.typeAccum,
          breakStart: data.breakStart, breakAccum: data.breakAccum
        };
        data = Object.assign({}, DEFAULT_DATA, incoming, live);
      }

      await saveData();
      render();
      alert('読み込みました。');
    };
    reader.readAsText(file);
  }

  /* ---------------- actions ---------------- */

  async function onReady(){
    ensureAudio();
    playReadyTone();
    warned = false;
    butterfliesSeen = 0;
    pupCoats = [];
    stopReminder();
    if(data.soundOn !== false) startReminder(nudgePlan(data.thresholdSec).ms);
    banner = null;
    data.phase = 'ready';
    data.readyStart = Date.now();
    data.initialElapsed = null;
    data.workAccum = 0;
    data.typeAccum = {};
    data.workStart = null;
    data.breakAccum = 0;
    data.breakStart = null;
    data.hoursChimed = 0;
    data.goalCelebrated = false;
    await saveData();
    startTicking();
    render();
  }

  async function onGo(){
    const elapsed = readyElapsed();
    const fast = elapsed <= data.thresholdSec;
    data.initialElapsed = elapsed;
    data.logs = data.logs || [];
    data.logs.push({ ts: Date.now(), elapsed });
    data.phase = 'working';
    data.workStart = Date.now();
    cheerSlot = 0;
    pickCheer();
    stopReminder();
    playGoTone();
    if(fast) playFanfare();
    banner = fast
      ? { text: `🔥 Off the line in ${fmtElapsed(elapsed)} — under your ${Math.round(data.thresholdSec/60)} min line`, celebrate: true }
      : { text: `Started after ${fmtElapsed(elapsed)}. The clock is running.`, celebrate: false };
    await saveData();
    render();
    if(fast) celebrateBurst();
  }

  async function onBreak(){
    bankStretch();
    data.workAccum = workElapsed();
    data.workStart = null;
    data.breakStart = Date.now();
    data.phase = 'break';
    playPause();
    banner = { text: 'On a break. The clock is paused.', celebrate: false };
    await saveData();
    render();
  }

  async function onRestart(){
    data.breakAccum = restElapsed();
    data.breakStart = null;
    data.workStart = Date.now();
    data.phase = 'working';
    playResume();
    banner = null;
    await saveData();
    render();
  }

  async function onFinish(){
    bankStretch();
    const work = workElapsed();
    const rest = restElapsed();
    const segments = typeTotals();
    // the type the session spent the most time on
    let dominant = data.taskType || 'WORK', best = -1;
    Object.keys(segments).forEach(k => { if(segments[k] > best){ best = segments[k]; dominant = k; } });
    data.sessions = data.sessions || [];
    data.sessions.push({
      ts: Date.now(),
      type: dominant,
      segments: segments,
      initial: data.initialElapsed || 0,
      work: work,
      rest: rest
    });
    data.workAccum = work;
    data.workStart = null;
    data.breakAccum = rest;
    data.breakStart = null;
    data.phase = 'done';
    cheerText = null;
    cheerSlot = -1;
    stopTicking();
    stopReminder();
    playClose();
    banner = null;
    await saveData();
    render();
  }

  async function onDoneReset(){
    data.phase = 'idle';
    data.readyStart = null;
    data.initialElapsed = null;
    data.workStart = null;
    data.workAccum = 0;
    data.typeAccum = {};
    data.breakStart = null;
    data.breakAccum = 0;
    data.hoursChimed = 0;
    data.goalCelebrated = false;
    banner = null;
    await saveData();
    render();
  }

  async function onClearAll(){
    if(!confirm('Delete every logged session? This cannot be undone.')) return;
    data.logs = [];
    data.sessions = [];
    await saveData();
    render();
  }

  async function onChartMode(mode){
    data.chartMode = mode;
    data.chartOffset = 0;
    await saveData();
    render();
  }

  async function onChartPage(step){
    const next = (data.chartOffset || 0) + step;
    if(next < 0) return;                     // never page into the future
    data.chartOffset = next;
    await saveData();
    render();
  }

  function ensureTypes(){
    if(!data.types || !data.types.length){
      data.types = DEFAULT_TYPES.map(t => Object.assign({}, t));
    }
    return data.types;
  }

  async function onTypeEdit(id, patch){
    const list = ensureTypes();
    const t = list.find(x => x.id === id);
    if(!t) return;
    if(patch.label !== undefined){
      const v = patch.label.trim();
      t.label = v || t.id;
    }
    if(patch.color !== undefined) t.color = patch.color;
    if(patch.icon !== undefined){ t.icon = patch.icon; iconPickerFor = null; }
    await saveData();
    render();
  }

  async function onTypeAdd(){
    const list = ensureTypes();
    if(list.length >= 8) return;
    const palette = ['#8FB98A', '#D2A25C', '#9A8FC0', '#D08C70', '#7FB3AC'];
    list.push({
      id: 't' + Date.now().toString(36),
      label: 'NEW',
      color: palette[list.length % palette.length],
      icon: 'leaf'
    });
    await saveData();
    render();
  }

  async function onTypeDelete(id){
    const list = ensureTypes();
    if(list.length <= 1) return;
    const i = list.findIndex(t => t.id === id);
    if(i < 0) return;
    list.splice(i, 1);
    // if the deleted type was selected, fall back to the first one
    if(data.taskType === id) data.taskType = list[0].id;
    await saveData();
    render();
  }

  async function onTypeChange(key){
    if(data.phase === 'done') return;
    if(key === data.taskType) return;
    // Close off the stretch under the old type before switching.
    bankStretch();
    data.taskType = key;
    await saveData();
    render();
  }

  async function onStartGoalChange(e){
    let v = parseInt(e.target.value, 10);
    if(isNaN(v) || v < 1) v = 1;
    if(v > 60) v = 60;
    data.thresholdSec = v * 60;
    await saveData();
    render();
  }

  async function onWorkGoalChange(e){
    let v = parseInt(e.target.value, 10);
    if(isNaN(v) || v < 1) v = 1;
    if(v > 1440) v = 1440;
    data.workGoalSec = v * 60;
    await saveData();
    render();
  }

  async function onSoundToggle(){
    data.soundOn = data.soundOn === false;
    if(!data.soundOn) stopReminder();
    await saveData();
    render();
    if(data.soundOn){ ensureAudio(); playChime(); }
  }

  /* ---------------- init ---------------- */

  async function init(){
    if(EMBEDDED) document.body.classList.add('embedded');
    await loadData();
    loadSync();
    butterfliesSeen = Math.floor(workElapsed() / 180);
    if(data.phase === 'ready' || data.phase === 'working' || data.phase === 'break') startTicking();
    startStatus();
    render();

    document.addEventListener('visibilitychange', () => {
      if(!document.hidden && syncCfg.auto && syncReady()) syncPull(true);
    });
    if(syncCfg.auto && syncReady()) setTimeout(() => syncNow(true), 800);
  }

  init();
})();
</script>

</body>
</html>
