  }
  function playFanfare(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t = ctx.currentTime + .16;
    [523.25, 659.25, 783.99, 1046.5].forEach((f,i) => playNote(ctx, f, t + i*.105, .9 + i*.15, .055));
    playNote(ctx, 1318.5, t + .52, 1.5, .035);
  }
  // A gentler rise, for starting late but starting all the same.
  function playSoftFanfare(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t = ctx.currentTime + .04;
    playNote(ctx, 587.33, t, 1.4, .05);          // D5
    playNote(ctx, 783.99, t + .18, 1.9, .05);    // G5
    playNote(ctx, 987.77, t + .36, 2.4, .04);    // B5, left ringing
    playNote(ctx, 391.99, t + .36, 2.6, .026);   // G4 underneath for body
  }
  // Setting a snooze: a soft step down.
  function playSnoozeSet(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t = ctx.currentTime + .02;
    playNote(ctx, 880.0, t, 1.1, .045);
    playNote(ctx, 587.33, t + .18, 1.7, .045);
  }
  // The snooze running out: a brighter three-note call.
  function playSnoozeAlert(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t = ctx.currentTime + .02;
    playNote(ctx, 659.25, t, 1.2, .06);
    playNote(ctx, 880.0, t + .2, 1.4, .06);
    playNote(ctx, 1174.66, t + .4, 1.9, .05);
  }
  function playChime(){
    if(data.soundOn === false) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t = ctx.currentTime + .02;
    playNote(ctx, 784.0, t, 1.5, .07);
    playNote(ctx, 587.33, t + .42, 1.9, .055);
  }

  // The nudge tightens as the goal line approaches.
  //   more than 1 min left : two notes, once a minute
  //   1 min left           : one note every 5 s
  //   30 s left            : one note every 3 s
  //   5 s left             : one note every second
  //   past the goal        : back to two notes a minute
  let reminderHandle = null, reminderKey = null;
  function nudgePlan(remaining){
    if(remaining > 60) return { ms:60000, notes:2 };
    if(remaining > 30) return { ms:5000,  notes:1 };
    if(remaining > 5)  return { ms:3000,  notes:1 };
    if(remaining > 0)  return { ms:1000,  notes:1 };
    return { ms:60000, notes:2 };
  }
  function playReminderNote(notes){
    if(data.phase !== 'ready'){ stopReminder(); return; }
    if(data.soundOn === false) return;
    const ctx = ensureAudio(); if(!ctx) return;
    const t = ctx.currentTime + .02;
    playNote(ctx, 784.0, t, 1.4, .055);                    // G5
    if(notes >= 2) playNote(ctx, 587.33, t + .34, 1.7, .05); // D5 underneath
  }
  function currentPlan(){
    const goal = (data.armed && data.armed.goalSec) || 300;
    return nudgePlan(goal - armedElapsed());
  }
  function startReminder(plan){
    const key = plan.ms + ':' + plan.notes;
    if(reminderKey === key && reminderHandle) return;
    stopReminder();
    reminderKey = key;
    reminderHandle = setInterval(() => playReminderNote(plan.notes), plan.ms);
  }
  function stopReminder(){
    if(reminderHandle){ clearInterval(reminderHandle); reminderHandle = null; }
    reminderKey = null;
  }

  function notify(title, body){
    try{
      if(!('Notification' in window)) return;
      if(Notification.permission !== 'granted') return;
      new Notification(title, { body:body, tag:'on-your-marks' });
    }catch(e){}
  }

  /* ---------------- celebration ---------------- */

  function celebrate(opts){
    const o = opts || {};
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const dial = $q('.dial-wrap') || $q('.btn-slot');
    if(!dial) return;
    const r = dial.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const layer = document.createElement('div');
    layer.className = 'burst-layer';
    const palette = o.palette || ['#E9B441','#C98A12','#F5D77A','#F2A62D','#46AFC2','#7ACBD9','#E07A3C'];
    const waves = o.waves || 2, per = o.per || 26, reach = o.reach || 1;
    for(let wave=0; wave<waves; wave++){
      for(let i=0;i<per;i++){
        const p = document.createElement('span');
        p.className = 'confetti';
        const angle = (Math.PI*2*i)/per + (Math.random()-.5)*.5;
        const dist = (110 + Math.random()*170 + wave*20) * reach;
        const w = 5 + Math.random()*7;
        const h = Math.random() < .45 ? w : w*(1.6+Math.random());
        p.style.cssText = `left:${cx}px; top:${cy}px; width:${w}px; height:${h}px;` +
          `background:${palette[Math.floor(Math.random()*palette.length)]};` +
          `border-radius:${Math.random()<.4 ? '50%' : '2px'};`;
        p.style.setProperty('--dx', (Math.cos(angle)*dist).toFixed(0)+'px');
        p.style.setProperty('--dy', (Math.sin(angle)*dist + 70 + Math.random()*90).toFixed(0)+'px');
        p.style.setProperty('--rot', (Math.random()*900-450).toFixed(0)+'deg');
        p.style.setProperty('--dur', (1.6+Math.random()*1.1).toFixed(2)+'s');
        p.style.animationDelay = (wave*.26 + Math.random()*.16).toFixed(2)+'s';
        layer.appendChild(p);
      }
    }
    document.body.appendChild(layer);
    setTimeout(() => layer.remove(), 3400);
  }

  /* ---------------- schedule maths ---------------- */

  const DAY_LETTERS = ['月','火','水','木','金','土','日'];   // index 0 = Monday
  function jsDayToIdx(d){ return (d + 6) % 7; }               // Sun=0 -> 6

  function parseHM(t){
    const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
    if(!m) return { h:9, m:0 };
    return { h:Math.min(23, parseInt(m[1],10)), m:Math.min(59, parseInt(m[2],10)) };
  }
  function timeOn(dateLike, hm){
    const d = new Date(dateLike);
    d.setHours(hm.h, hm.m, 0, 0);
    return d;
  }
  // An empty array means "no repeat"; a missing one is an older task and
  // still means every day.
  function taskDays(task){
    return Array.isArray(task.days) ? task.days : [0,1,2,3,4,5,6];
  }
  function hasSchedule(task){
    if(!task || !/^\d{1,2}:\d{2}$/.test(task.time || '')) return false;
    return task.once ? true : taskDays(task).length > 0;
  }
  function runsOn(task, date){
    if(task.once) return !task.onceDay || dayKey5(date) === task.onceDay;
    return taskDays(task).indexOf(jsDayToIdx(date.getDay())) >= 0;
  }
  // Which day a one-off belongs to: today while its time is still ahead (or
  // only just behind), otherwise tomorrow.
  function onceTargetDay(time){
    const hm = parseHM(time);
    if(!hm) return dayKey5(new Date());
    const now = new Date();
    const at = timeOn(now, hm);
    if(now.getTime() - at.getTime() > CATCH_UP * 1000) at.setDate(at.getDate() + 1);
    return dayKey5(at);
  }
  // Next scheduled moment for a task, from `from` onward (exclusive of the past).
  function nextRun(task, from){
    if(!hasSchedule(task)) return null;
    const base = from || new Date();
    const hm = parseHM(task.time);
    for(let i=0;i<8;i++){
      const d = new Date(base);
      d.setDate(d.getDate() + i);
      const cand = timeOn(d, hm);
      if(cand.getTime() > base.getTime() && runsOn(task, cand)) return cand;
    }
    return null;
  }
  // Most recent scheduled moment at or before now (today only).
  function lastRunToday(task, now){
    if(!hasSchedule(task)) return null;
    const hm = parseHM(task.time);
    const cand = timeOn(now, hm);
    if(cand.getTime() <= now.getTime() && runsOn(task, cand)) return cand;
    return null;
  }
  function upcoming(){
    const now = new Date();
    let best = null;
    (data.tasks || []).forEach(t => {
      if(t.on === false) return;
      const n = nextRun(t, now);
      if(n && (!best || n.getTime() < best.when.getTime())) best = { task:t, when:n };
    });
    return best;
  }
  // A one-off task belongs to a single day and never comes back.
  function onceDayLabel(task){
    if(!task.onceDay) return '1回のみ';
    const p = String(task.onceDay).split('-');
    return '1回のみ ' + Number(p[1]) + '/' + Number(p[2]);
  }
  function daysLabel(task){
    if(task.once) return onceDayLabel(task);
    const d = taskDays(task).slice().sort((a,b)=>a-b);
    if(!d.length) return 'くり返しなし';
    if(d.length === 7) return '毎日';
    if(d.length === 5 && d.join() === '0,1,2,3,4') return '平日';
    if(d.length === 2 && d.join() === '5,6') return '週末';
    return d.map(i => DAY_LETTERS[i]).join('');
  }

  const DAY_FLIP = 5;
  function dayStart5(when){
    const x = new Date(when == null ? Date.now() : when);
    if(x.getHours() < DAY_FLIP) x.setDate(x.getDate() - 1);
    x.setHours(DAY_FLIP, 0, 0, 0);
    return x;
  }
  function dayKey5(when){
    const d = dayStart5(when);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  // Finished with a GO, or set aside for today — either way it drops to
  // the bottom of the list and goes quiet.
  function isSpent(t){
    const k = dayKey5();
    return t.doneOn === k || t.skipOn === k;
  }

  function goalOf(task){ return (task && task.goalSec) ? task.goalSec : 300; }

  // Order by the 05:00 day: an 01:00 task belongs to the end of the night,
  // not the beginning of the morning. Timeless tasks sit at the bottom.
  function timeOrder(t){
    if(!t.time) return 1e9;
    const hm = parseHM(t.time);
    return ((hm.h * 60 + hm.m) - 300 + 1440) % 1440;
  }

  /* ---------------- arming ---------------- */

  function armedElapsed(){
    if(!data.armed) return 0;
    return (Date.now() - data.armed.planned) / 1000;
  }

  function armTask(task, plannedTs, auto){
    if(task && !auto){ task.doneOn = null; task.skipOn = null; }
    data.phase = 'ready';
    data.armed = {
      taskId: task ? task.id : null,
      label: task ? task.label : '指定なし',
      type: task ? task.type : (typeList()[0] || {}).id,
      planned: plannedTs,
      opened: Date.now(),
      goalSec: goalOf(task),
      auto: !!auto,
      snoozeUntil: null,
      snoozeCount: 0
    };
    snoozeOpen = false;
    pickerOpen = false;
    data.lastResult = null;
    data.snoozed = null;
    if(task && auto){ task.firedOn = dayKey5(plannedTs); }
    saveData();
    stopReminder();
    barkSlot = -1;
    if(data.soundOn !== false) startReminder(currentPlan());
    playArmTone();
    startTicking();
    render();
  }

  // Fired by the clock while the app is open.
  // How long after the scheduled minute a start can still be picked up.
  // Covers a tab that was asleep, or the app being opened a little late.
  const CATCH_UP = 30 * 60;

  function scheduleWatch(){
    if(data.snoozed){
      if(Date.now() >= data.snoozed.at){ resumeSnooze(); return; }
      if(Date.now() - data.snoozed.paused > 12 * 3600 * 1000) data.snoozed = null;
    }
    if(data.autoArm === false) return;

    // A countdown left running from hours ago would block every later task.
    if(data.phase === 'ready' && data.armed &&
       Date.now() - data.armed.planned > 6 * 3600 * 1000){
      data.phase = 'idle';
      data.armed = null;
      saveData();
      render();
    }
    const now = new Date();
    const today = dayKey5(now);
    for(const t of (data.tasks || [])){
      if(t.on === false) continue;
      if(t.firedOn === today) continue;
      if(isSpent(t)) continue;
      const last = lastRunToday(t, now);
      if(!last) continue;
      const age = (now.getTime() - last.getTime()) / 1000;
      if(age >= 0 && age <= CATCH_UP){
        // Already counting down for this very task: leave it alone.
        if(data.phase === 'ready' && data.armed && data.armed.taskId === t.id) return;
        notify('時間になりました', `${t.label} — ${t.time}`);
        armTask(t, last.getTime(), true);
        PAWS.setTab('fm');          // bring the countdown into view
        return;
      }
    }
  }

  // Called once at start-up: honour ?go= / ?t=, or pick up a start we just missed.
  function bootArm(){
    const q = new URLSearchParams(window.location.search);
    const go = q.get('go') || q.get('start') || q.get('task');
    const tOverride = q.get('t');
    if(!go) return false;

    const now = Date.now();
    let planned = now;
    if(tOverride && /^\d+$/.test(tOverride)) planned = parseInt(tOverride, 10);

    let task = null;
    if(go !== 'now' && go !== 'quick'){
      task = (data.tasks || []).find(t => t.id === go || t.label === go) || null;
    }
    if(task && !tOverride){
      const hm = parseHM(task.time);
      const cand = timeOn(new Date(), hm).getTime();
      // If the scheduled moment is in the recent past, measure from it.
      if(cand <= now && now - cand <= 6*3600*1000) planned = cand;
      // Fired a touch early? Still measure from the scheduled moment.
      else if(cand > now && cand - now <= 5*60*1000) planned = cand;
    }
    if(!task && go !== 'now' && go !== 'quick') return false;
    if(!task){
      armTask(null, planned, true);
    } else {
      armTask(task, planned, true);
    }
    // Clean the query out so a reload doesn't re-arm.
    try{ history.replaceState(null, '', window.location.pathname); }catch(e){}
    return true;
  }

  /* ---------------- stats ---------------- */

  function stats(){
    const logs = data.logs || [];
    const todays = logs.filter(l => isToday(l.ts));
    const todayAvg = todays.length ? todays.reduce((a,b)=>a+b.lag,0)/todays.length : null;
    let best = null, bestTs = null;
    logs.forEach(l => { if(best === null || l.lag < best){ best = l.lag; bestTs = l.ts; } });
    const onTime = logs.filter(l => l.lag <= (l.goalSec || 300)).length;
    const rate = logs.length ? Math.round(onTime/logs.length*100) : null;
    return { todayAvg, best, bestTs, rate, count:todays.length, total:logs.length };
  }

  function chartRows(){
    const n = data.chartDays || 14;
    const end = startOfDay(new Date());
    const rows = [];
    for(let i=n-1;i>=0;i--){
      const d = new Date(end); d.setDate(d.getDate()-i);
      const next = new Date(d); next.setDate(next.getDate()+1);
      const inDay = (data.logs||[]).filter(l => l.ts >= d.getTime() && l.ts < next.getTime());
      const avg = inDay.length ? inDay.reduce((a,b)=>a+b.lag,0)/inDay.length : 0;
      rows.push({ date:d, avg:avg, n:inDay.length });
    }
    return rows;
  }

  /* ---------------- view state ---------------- */

  let editId = null;      // null | 'new' | task id
  let urlFor = null;      // task id whose shortcut URL is shown
  let helpOpen = false;
  let typeEditing = false;
  let syncOpen = false;
  let snoozeOpen = false;
  // A short word for landing inside the goal. The record's own name sits
  // in the line underneath, so this spot is free to just be pleased.
  const PRAISE = ['Wonderful!', 'Beautifully done.', 'Right on the line.',
                  'That was quick.', 'Off you go!', 'Nicely started.'];
  let lastPraise = PRAISE[0];
  let handoffPending = false;
  const FIRST_BARK = 'いつでもいいよ';
  const BARKS = ['いつでもいいワン', '待ってるワン', 'まずは机の前まで',
                 'お散歩いきたい', 'ワクワク', 'はじめの一歩'];
  const PAW_TAG = '<span class="bpaw"></span>';
  let barkText = BARKS[0];
  let barkSlot = -1;
  function pickBark(){
    let next = barkText;
    while(BARKS.length > 1 && next === barkText) next = BARKS[Math.floor(Math.random() * BARKS.length)];
    barkText = next;
  }
  let pickerOpen = false;
  let askType = null;            // a type waiting on the "track it?" answer
  let iconPickerFor = null;
  let histOpen = false;
  let banner = null;      // { text, celebrate }
  let draft = null;       // task being edited in the form

  const DIAL_SIZE = 260, DIAL_R = 108, FEET = 9;
  // The butterfly rides the edge of the colour, upright, without the
  // walker's rotation.
  const FLY_LEAD = 0.033;           // a nose-length ahead, so it never sits on the dog
  function placeFly(el, p){
    if(!el) return;
    const t = ((p + FLY_LEAD) % 1 + 1) % 1;
    const a = -Math.PI/2 + t*Math.PI*2;
    // Right by twelve o'clock the dog is in the way, so the butterfly
    // lifts over its head instead of flying through it.
    const near = Math.min(t, 1 - t);
    const lift = near < 0.025 ? (0.025 - near) / 0.025 * 18 : 0;
    const r = DIAL_R + 23 + lift;   // just above the ring, at the dog's shoulder
    el.style.left = (DIAL_SIZE/2 + Math.cos(a)*r).toFixed(1) + 'px';
    el.style.top  = (DIAL_SIZE/2 + Math.sin(a)*r).toFixed(1) + 'px';
  }

  function placeOnRing(el, p){
    if(!el) return;
    const t = ((p % 1) + 1) % 1;
    const a = -Math.PI/2 + t*Math.PI*2;
    const cx = DIAL_SIZE/2 + Math.cos(a)*(DIAL_R+FEET);
    const cy = DIAL_SIZE/2 + Math.sin(a)*(DIAL_R+FEET);
    el.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px) rotate(${(a*180/Math.PI+90).toFixed(1)}deg)`;
  }

  function dialState(){
    if(data.phase === 'ready' && data.armed){
      const goal = data.armed.goalSec || 300;
      const el = armedElapsed();
      const left = goal - el;
      const p = el / goal;
      return {
        main: left >= 0 ? fmtElapsed(left) : '+' + fmtElapsed(-left),
        label: left >= 0 ? 'get moving' : 'over goal',
        progress: Math.min(Math.max(p,0), 1),
        raw: p,
        color: ringColor(p, typeColor(data.armed.type)),
        live: true
      };
    }
    return { main:'0:00', label:'standing by', progress:0, raw:0, color:ringColor(0), live:false };
  }

  /* ---------------- markup pieces ---------------- */

  function shortcutUrl(taskId){
    const base = window.location.origin + window.location.pathname;
    return base + '?go=' + encodeURIComponent(taskId);
  }

  function renderNextUp(){
    const up = upcoming();
    if(!up){
      return `<div class="nextup">
        <div><div class="l">next up</div><div class="n">予定がまだありません</div></div>
        <div class="cd"><b>—</b><span>タスクを追加</span></div>
      </div>`;
    }
    const ms = up.when.getTime() - Date.now();
    const mins = Math.max(0, Math.floor(ms/60000));
    const h = Math.floor(mins/60), m = mins%60;
    const cd = h > 0 ? h + 'h ' + m + 'm' : m + 'm';
    const sameDay = dayKey(up.when.getTime()) === dayKey(Date.now());
    return `<div class="nextup">
      <div style="min-width:0">
        <div class="l">next up · ${sameDay ? '今日' : (up.when.getMonth()+1) + '/' + up.when.getDate()}</div>
        <div class="n"><span class="tag" style="background:${typeColor(up.task.type)}">${esc(typeLabel(up.task.type))}</span>${esc(up.task.label)}</div>
      </div>
      <div class="cd"><b>${pad2(up.when.getHours())}:${pad2(up.when.getMinutes())}</b><span>あと ${cd}</span></div>
    </div>`;
  }

  function renderDial(st){
    const c = 2*Math.PI*DIAL_R;
    const a = data.armed || {};
    return `<div class="dial-wrap">
      <div class="glow ${st.live ? 'running' : ''}" style="background:radial-gradient(circle, ${st.color} 0%, transparent 70%)"></div>
      <svg class="ring" width="260" height="260" viewBox="0 0 260 260">
        <circle class="ring-track" cx="130" cy="130" r="108" fill="none" stroke-width="8"/>
        <circle class="ring-fill" cx="130" cy="130" r="108" fill="none" stroke-width="8"
                stroke="${st.color}"
                stroke-dasharray="${(c*(1-st.progress)).toFixed(1)} ${c.toFixed(1)}"
                stroke-dashoffset="${(-c*st.progress).toFixed(1)}"/>
      </svg>
      <div class="dial-center">
        <div class="type-badge" style="color:${typeColor(a.type)}">${typeIcon(a.type)}</div>
        <div class="time-display">${st.main}</div>
        <div class="state-label">${st.label}</div>
        <div class="dial-task">${esc(a.label || '')}</div>
        <div class="dial-plan">予定 ${fmtClock(a.planned)} · 経過 ${fmtElapsed(armedElapsed())}</div>
      </div>
      <div class="walker still" id="fmWalker">${DOG_SVG}</div>
      <div class="dog-bubble hide">${barkText}${PAW_TAG}</div>
      <div class="ring-bfly" id="fmBfly"><svg viewBox="0 0 20 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="wing"><ellipse cx="6" cy="7" rx="4.6" ry="5.4" fill="#F2D24B" opacity="0.92"/><ellipse cx="14" cy="7" rx="4.6" ry="5.4" fill="#F7DF74" opacity="0.92"/><ellipse cx="6.6" cy="12.6" rx="3.2" ry="3.6" fill="#EFC93B" opacity="0.88"/><ellipse cx="13.4" cy="12.6" rx="3.2" ry="3.6" fill="#F5D95E" opacity="0.88"/></g><rect x="9.3" y="5" width="1.4" height="9" rx="0.7" fill="#8A6C4F"/></svg></div>
    </div>`;
  }

  // A snooze puts the countdown away entirely: the clock stops, the screen
  // goes back to standing by, and the whole thing returns at the chosen time.
  function isSnoozing(){ return !!data.snoozed; }

  function currentType(){
    const list = typeList();
    return list.find(t => t.id === data.fmType) ? data.fmType : list[0].id;
  }
  function typeBtn(t, attr, on){
    return `<button class="type-btn ${on ? 'on' : ''}" ${attr}="${esc(t.id)}"
      style="${on ? `background:linear-gradient(135deg,${shade(t.color,8)},${t.color} 55%,${shade(t.color,-8)}); box-shadow:0 6px 14px -7px ${shade(t.color,-8)}` : ''}">${esc(t.label)}</button>`;
  }
  function renderTypeRow(){
    const cur = currentType();
    return `<div class="type-row">
      ${typeList().map(t => typeBtn(t, 'data-fmtype', t.id === cur)).join('')}
    </div>`;
  }

  function renderTypeSettings(){
    return `<div class="type-pick">
      <div class="goal-row">
        <div class="settings">
          <span class="lbl">${ICON.clock}Session</span>
          <button class="toggle ${data.fmTrack === false ? '' : 'on'}" id="fmTrack">${data.fmTrack === false ? 'OFF' : 'ON'}</button>
        </div>
        <div class="settings">
          <span class="lbl">${ICON.sound}Sound</span>
          <button class="toggle ${data.soundOn === false ? '' : 'on'}" id="fmSound">${data.soundOn === false ? 'OFF' : 'ON'}</button>
        </div>
      </div>
      <div class="settings">
        <span class="lbl">${ICON.target}開始目標</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <input type="number" id="fmGoal" min="1" max="120" value="${Math.round((data.fmGoalSec || 300)/60)}"> 分以内
        </div>
      </div>
    </div>`;
  }

  // Starting from a type alone: no task, so we have to ask whether the
  // work afterwards should be timed.
  function armType(typeId, track){
    ensureAudio();
    data.phase = 'ready';
    data.armed = {
      taskId: null, label: typeLabel(typeId), type: typeId,
      planned: Date.now(), opened: Date.now(),
      goalSec: data.fmGoalSec || 300, auto: false,
      snoozeUntil: null, snoozeCount: 0, snoozedTotal: 0,
      session: !!track
    };
    data.fmType = typeId;
    data.lastResult = null;
    data.snoozed = null;
    pickerOpen = false;
    askType = null;
    saveData();
    stopReminder();
    if(data.soundOn !== false) startReminder(currentPlan());
    playArmTone();
    startTicking();
    render();
  }

  function renderSnoozeNotice(){
    const s = data.snoozed;

        <div class="small">${fast

        ${handoffPending ? '<div class="handoff-note">handing over to Session…</div>' : ''}

    const list = (data.tasks || []).slice().sort((a,b) => (isSpent(a) - isSpent(b)) || (timeOrder(a) - timeOrder(b)));
    const wave = '#D2BE9E';
    return `<div class="checkin-wrap small">

  function renderChart(){
    const rows = chartRows();
    const any = (data.logs || []).length > 0;
    const head = `<div class="chart-head"><span class="t lbl">${ICON.bars}動き出しまでの時間</span>
      <span style="font-family:'Space Mono',monospace; font-size:10px; color:var(--text-faint)">日平均 · ${rows.length}日</span></div>`;
    if(!any){
      return `<div class="card">${head}<div class="chart-empty">記録がまだありません。<br>ひとつ計測すると、ここに出ます。</div></div>`;
    }
    const goal = 300;
    const maxV = Math.max(goal*1.3, ...rows.map(r => r.avg)) || 1;
    const bars = rows.map(r => {
      const hPct = r.avg > 0 ? Math.max((r.avg/maxV)*100, 3) : 0;
      const col = r.avg > 0 ? ringColor(r.avg/goal) : 'transparent';
      const tip = `${r.date.getMonth()+1}/${r.date.getDate()} · ${r.n ? fmtElapsed(r.avg) + ' (' + r.n + '件)' : '記録なし'}`;
      return `<div class="bar-col"><div class="bar" style="height:${hPct}%; background:${col}" title="${tip}"></div></div>`;
    }).join('');
    const labels = rows.map((r,i) => `<span>${(i % 2 === 0 || rows.length <= 8) ? (r.date.getMonth()+1)+'/'+r.date.getDate() : ''}</span>`).join('');
    return `<div class="card">${head}
      <div class="chart-body">
        <div class="goal-line" style="top:${((1-goal/maxV)*100).toFixed(1)}%"><span class="goal-tag">5分</span></div>
        <div class="bars">${bars}</div>
      </div>
      <div class="day-labels">${labels}</div>
    </div>`;
  }

    return `<div class="log-list">${logs.map((l,i) => `

    return `<div class="help ${helpOpen ? 'open' : ''}">

      ${helpOpen ? `<div class="help-body">
        <p>iPhone の「ショートカット」アプリで、決めた時刻にこのページを開くようにします。開いた瞬間に計測がはじまります。</p>
        <h4>1. オートメーションを作る</h4>
        <ol>
          <li>ショートカット App →「オートメーション」タブ → 右上の <b>+</b></li>

          <li>続けて <b>「URL を開く」</b> アクションを追加</li>
        </ol>
        <h4>3. 動作</h4>
        <p>時刻になると Safari がこのページを開き、そのタスクの計測が自動で始まります。あとは実際に取りかかった瞬間に <b>GO!</b> を押すだけ。予定時刻から GO! までの時間が記録されます。</p>
        <h4>4. パソコンと同期する（GitHub Gist）</h4>
        <ol>
          <li>GitHub で <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens</b> を開き「Generate new token」</li>
          <li><b>Account permissions → Gists</b> を <b>Read and write</b> に設定（他の権限は不要）。有効期限はお好みで</li>
          <li>発行された <code>github_pat_…</code> を、このアプリの <b>Sync → 設定 → トークン</b> に貼り付け</li>
          <li><b>「Gist を作成」</b>を押すと非公開の Gist ができ、記録がそこに保存されます</li>

        <p>以降は、記録するたびに自動でアップロードされ、アプリを開いたときと画面に戻ったときに自動で取り込みます。記録は両方の端末の分が統合され、タスクや種類の設定は「あとから変更したほう」が残ります。</p>
        <p>トークンはその端末のブラウザにだけ保存され、GitHub 以外には送信されません。EXPORT したファイルにも含まれないので、バックアップから漏れることもありません。</p>

        <h4>5. パソコン（Edge）で開く</h4>
        <ol>
          <li>Edge でこのページを開く</li>
          <li>右上の <b>…</b> →「アプリ」→<b>「このサイトをアプリとしてインストール」</b></li>
          <li>名前を確認して「インストール」。デスクトップとスタートメニューにアイコンができます</li>
        </ol>
        <p>こうすると既定のブラウザが何であっても、そのアイコンからは必ず Edge で開きます。アドレスバーのない専用ウィンドウになるので、時計アプリのように使えます。<br>
        インストール時に「タスクバーにピン留めする」「起動時に自動的に開く」を選んでおくと、パソコンを立ち上げたときから待機できます。</p>

        <h4>補足</h4>

      </div>` : ''}
    </div>`;
  }

    `;

    bind('fmGo', onGo);
